<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SQL Lab</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app/app.css?v=4">
<style>
.wrap{max-width:900px;margin:0 auto;padding:32px 22px 80px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,4.6vw,36px);
  letter-spacing:-.025em;margin:0 0 8px}
.lede{color:var(--ink-2);font-size:15px;max-width:64ch;margin:0 0 4px}

.split{display:grid;grid-template-columns:1fr 300px;gap:18px;margin-top:22px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.phead{display:flex;align-items:center;gap:10px;padding:11px 15px;
  border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.phead .spacer{flex:1}
.pbody{padding:15px}

textarea{width:100%;min-height:104px;font-family:var(--mono);font-size:13.5px;
  line-height:1.6;color:var(--ink);background:var(--cabinet);color:var(--cabinet-ink);
  border:0;border-radius:var(--r-sm);padding:13px 15px;resize:vertical;outline:none;
  tab-size:2}
textarea:focus{box-shadow:0 0 0 3px var(--accent-soft)}

button{font:inherit;cursor:pointer;border-radius:var(--r-sm);padding:8px 15px;
  font-size:13.5px;font-weight:600;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2)}
button:hover{border-color:var(--accent);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.08);color:#fff}
button:active{transform:translateY(1px)}
.bar{display:flex;gap:9px;align-items:center;margin-top:11px;flex-wrap:wrap}
.hintline{font-size:12.5px;color:var(--ink-3)}

table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);
  white-space:nowrap}
th{background:var(--surface-2);font-family:var(--mono);font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono)}
.scroll{overflow-x:auto}
.rowcount{font-size:12.5px;color:var(--ink-3);padding:9px 15px;border-top:1px solid var(--line)}

.msg{padding:12px 15px;border-radius:var(--r-sm);font-size:14px;line-height:1.55;margin:0}
.msg.err{background:var(--warm-soft);color:var(--warm)}
.msg.ok{background:var(--accent-soft);color:var(--accent)}
.msg b{display:block;margin-bottom:3px}

.task{border-bottom:1px solid var(--line);padding:12px 15px;font-size:13.5px;cursor:pointer;
  display:flex;gap:10px;align-items:flex-start;color:var(--ink-2)}
.task:last-child{border-bottom:0}
.task:hover{background:var(--surface-2)}
.task.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.task .tick{font-family:var(--mono);font-size:12px;width:16px;flex:none;color:var(--ink-3)}
.task.done .tick{color:var(--accent)}
.schema{font-family:var(--mono);font-size:12px;color:var(--ink-3);line-height:1.8;
  padding:13px 15px}
.schema b{color:var(--ink-2);font-weight:600}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}
</style>

<div class="wrap">
  <h1>SQL Lab</h1>
  <p class="lede">The same two tables as <code>school.sql</code> and <code>courses.sql</code>,
  running in this page. Write real SQL, see real rows. When you open phpMyAdmin later,
  everything here works there unchanged.</p>

  <div class="split">
    <div>
      <div class="panel">
        <div class="phead"><span id="taskname">Free query</span><span class="spacer"></span>
          <span id="taskscore"></span></div>
        <div class="pbody">
          <p id="taskq" class="hintline" style="margin:0 0 10px"></p>
          <textarea id="sql" spellcheck="false">SELECT * FROM students;</textarea>
          <div class="bar">
            <button class="primary" id="run">Run</button>
            <button id="check" hidden>Check my answer</button>
            <button id="hint" hidden>Show the answer</button>
            <span class="spacer" style="flex:1"></span>
            <button id="reseed">reset the data</button>
          </div>
        </div>
      </div>
      <div id="out" style="margin-top:16px"></div>
    </div>

    <div>
      <div class="panel">
        <div class="phead">Tasks</div>
        <div id="tasks"></div>
      </div>
      <div class="panel" style="margin-top:16px">
        <div class="phead">The tables</div>
        <div class="schema" id="schema"></div>
      </div>
    </div>
  </div>
</div>

<script src="app/sql-engine.js?v=4"></script>
<script>
/* ---------------------------------------------------------------
   Tasks are marked by running her SQL and comparing the RESULT to
   the result of a known-good query, not by comparing the text. So
   any correct query passes, including ones phrased differently to
   the model answer, and a query that happens to look right but
   returns the wrong rows does not.
--------------------------------------------------------------- */
const TASKS = [
  { id: "t1", lesson: 9, q: "Show every student.",
    model: "SELECT * FROM students;" },
  { id: "t2", lesson: 9, q: "Show only the students with a grade of 10 or more.",
    model: "SELECT * FROM students WHERE grade >= 10;" },
  { id: "t3", lesson: 9, q: "Show every student, best grade first.",
    model: "SELECT * FROM students ORDER BY grade DESC;", ordered: true },
  { id: "t4", lesson: 9, q: "Show just the name and grade columns.",
    model: "SELECT name, grade FROM students;" },
  { id: "t5", lesson: 9, q: "Show only the Computer Science students.",
    model: "SELECT * FROM students WHERE major = 'Computer Science';" },
  { id: "t6", lesson: 9, q: "Show the students whose name begins with the letter S.",
    model: "SELECT * FROM students WHERE name LIKE 'S%';" },
  { id: "t7", lesson: 9, q: "How many students are there? One number.",
    model: "SELECT COUNT(*) FROM students;" },
  { id: "t8", lesson: 9, q: "What is the average grade?",
    model: "SELECT AVG(grade) FROM students;" },
  { id: "t9", lesson: 9, q: "Add a student called Rana, email rana@mail.com, major Design, grade 16.",
    model: "INSERT INTO students (name, email, major, grade) VALUES ('Rana', 'rana@mail.com', 'Design', 16);",
    write: true },
  { id: "t10", lesson: 9, q: "Sara retook the exam and now has 14. Update only her row.",
    model: "UPDATE students SET grade = 14 WHERE name = 'Sara Khalil';", write: true },
  { id: "t11", lesson: 9, q: "Delete the student with id 4. Only that one.",
    model: "DELETE FROM students WHERE id = 4;", write: true },
  { id: "t12", lesson: 10, q: "The detail page needs one course by its id. Show course 3.",
    model: "SELECT * FROM courses WHERE id = 3;" },
  { id: "t13", lesson: 10, q: "The search box. Find every course with the word PHP in the title.",
    model: "SELECT * FROM courses WHERE title LIKE '%PHP%';" },
  { id: "t14", lesson: 10, q: "The home page lists beginner courses, shortest first.",
    model: "SELECT * FROM courses WHERE level = 'beginner' ORDER BY hours ASC;", ordered: true },
  { id: "t15", lesson: 10, q: "How many courses does each teacher have? Teacher and count.",
    model: "SELECT teacher, COUNT(*) FROM courses GROUP BY teacher;" }
];

const $ = id => document.getElementById(id);
const KEY = "php_sqllab_done";
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ done = {}; }
let current = null;

function esc(s){ return String(s == null ? "NULL" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function table(cols, rows){
  if (!rows.length) return `<p class="msg">No rows. That is an answer too, not an error.</p>`;
  return `<div class="scroll"><table><thead><tr>${
    cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r => `<tr>${r.map(v =>
      `<td class="${typeof v === "number" ? "num" : ""}">${esc(v)}</td>`).join("")}</tr>`).join("")
  }</tbody></table></div><div class="rowcount">${rows.length} row${rows.length === 1 ? "" : "s"}</div>`;
}

function show(res){
  if (res.type === "select"){
    $("out").innerHTML = `<div class="panel">${table(res.cols, res.rows)}</div>`;
  } else {
    const warn = res.noWhere && res.affected > 1
      ? " <b style='display:inline'>No WHERE, so that hit every row.</b>" : "";
    $("out").innerHTML = `<p class="msg ok">${res.affected} row${res.affected === 1 ? "" : "s"} ${res.verb}.${warn}</p>`;
  }
  paintSchema();
}

function runSQL(quiet){
  const sql = $("sql").value.trim();
  try {
    const res = SQL.run(sql);
    if (!quiet) show(res);
    return res;
  } catch (e){
    if (!quiet) $("out").innerHTML = `<p class="msg err"><b>MySQL would say no.</b>${esc(e.message)}</p>`;
    return { error: e.message };
  }
}

/* comparing results, not text */
function same(a, b, ordered){
  if (!a || !b || a.type !== b.type) return false;
  if (a.type === "write") return a.affected === b.affected;
  if (a.cols.length !== b.cols.length) return false;
  const line = r => r.map(v => String(v)).join("\u0001");
  const A = a.rows.map(line), B = b.rows.map(line);
  if (A.length !== B.length) return false;
  if (ordered) return A.every((v, i) => v === B[i]);
  return A.slice().sort().join("\u0002") === B.slice().sort().join("\u0002");
}

function check(){
  const t = current;
  if (!t) return;
  const before = SQL.snapshot();

  // run hers on a fresh copy, keep what it produced
  SQL.reset(); Object.assign(SQL.tables(), JSON.parse(JSON.stringify(before)));
  const mine = runSQL(true);
  const afterMine = SQL.snapshot();

  // then the model answer, from the same starting point
  SQL.reset(); Object.assign(SQL.tables(), JSON.parse(JSON.stringify(before)));
  const want = SQL.run(t.model);
  const afterWant = SQL.snapshot();

  let ok;
  if (mine.error) ok = false;
  else if (t.write) ok = JSON.stringify(afterMine) === JSON.stringify(afterWant);
  else ok = same(mine, want, t.ordered);

  // leave the data as her query left it, so she sees what she did
  SQL.reset(); Object.assign(SQL.tables(), JSON.parse(JSON.stringify(afterMine)));

  if (mine.error){
    $("out").innerHTML = `<p class="msg err"><b>MySQL would say no.</b>${esc(mine.error)}</p>`;
  } else {
    show(mine);
    $("out").insertAdjacentHTML("afterbegin", ok
      ? `<p class="msg ok" style="margin-bottom:12px"><b>Correct.</b>That is the right result.</p>`
      : `<p class="msg err" style="margin-bottom:12px"><b>Not the right rows.</b>${
          t.write ? "The table did not end up the way it should." :
          "It ran, but the result is not what was asked for."}</p>`);
  }
  done[t.id] = ok || done[t.id] === true;
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch(e){}
  paintTasks();
}

function paintTasks(){
  const gotN = TASKS.filter(t => done[t.id]).length;
  $("tasks").innerHTML = TASKS.map(t => `
    <div class="task ${current && current.id === t.id ? "on" : ""} ${done[t.id] ? "done" : ""}"
         data-id="${t.id}">
      <span class="tick">${done[t.id] ? "✓" : "L" + t.lesson}</span>
      <span>${esc(t.q)}</span>
    </div>`).join("");
  $("tasks").querySelectorAll(".task").forEach(el => el.onclick = () => pick(el.dataset.id));
  $("taskscore").textContent = gotN + " / " + TASKS.length;
}

function pick(id){
  current = TASKS.find(t => t.id === id) || null;
  $("taskname").textContent = current ? ("Lesson " + current.lesson + " task") : "Free query";
  $("taskq").textContent = current ? current.q : "";
  $("check").hidden = !current;
  $("hint").hidden = !current;
  $("sql").value = "";
  $("sql").focus();
  paintTasks();
}

function paintSchema(){
  const db = SQL.tables();
  $("schema").innerHTML = Object.entries(db).map(([name, t]) =>
    `<div><b>${name}</b> (${t.rows.length} rows)<br>${t.cols.join(", ")}</div>`).join("<br>");
}

$("run").onclick = () => runSQL(false);
$("check").onclick = check;
$("hint").onclick = () => {
  if (!current) return;
  $("out").innerHTML = `<p class="msg"><b>One correct answer</b>
    <code style="font-family:var(--mono);font-size:13px">${esc(current.model)}</code>
    <br><span class="hintline">Yours does not have to match this text, only the rows it returns.</span></p>`;
};
$("reseed").onclick = () => {
  SQL.reset(); paintSchema();
  $("out").innerHTML = `<p class="msg ok">Both tables are back to how they started.</p>`;
};
$("sql").addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); runSQL(false); }
});

paintTasks();
paintSchema();
show(SQL.run("SELECT * FROM students;"));
</script>
<script src="app/embed.js?v=4"></script>
