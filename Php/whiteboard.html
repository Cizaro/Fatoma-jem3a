<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Whiteboard</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app/app.css?v=5">
<style>
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden;min-height:100dvh}
.bar{display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--surface);
  border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
.grp{display:flex;align-items:center;gap:4px}
.grp + .grp{padding-left:14px;border-left:1px solid var(--line)}
.t{width:36px;height:34px;border:1px solid transparent;background:none;border-radius:var(--r-sm);
  cursor:pointer;color:var(--ink-2);display:grid;place-items:center;padding:0}
.t:hover{background:var(--surface-2);color:var(--ink)}
.t.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.t svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.t[disabled]{opacity:.32;cursor:default}
.t[disabled]:hover{background:none;color:var(--ink-2)}

.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink-3)}
.wt{width:30px;height:30px;border:1px solid transparent;background:none;border-radius:var(--r-sm);
  cursor:pointer;display:grid;place-items:center;padding:0}
.wt:hover{background:var(--surface-2)}
.wt.on{background:var(--surface-2);border-color:var(--line)}
.wt i{display:block;background:var(--ink);border-radius:var(--r-pill)}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin-right:2px}
.spacer{flex:1}
.zlabel{background:none;border:1px solid var(--line);color:var(--ink-2);border-radius:var(--r-sm);
  font:inherit;font-family:var(--mono);font-size:11px;padding:6px 8px;min-width:48px;cursor:pointer}
.zlabel:hover{border-color:var(--accent);color:var(--accent)}
.savewrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 7px);z-index:20;min-width:252px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--lift);padding:7px}
.menu .mhead{margin:4px 9px 7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;
  border-radius:var(--r-sm);padding:9px 10px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.menu button:hover{background:var(--accent-soft);color:var(--accent)}
.txtbtn.danger{border-color:var(--warm);color:var(--warm);font-weight:600}

/* the picture, for when the browser will not let the page download it */
.shade{position:absolute;inset:0;z-index:30;background:rgba(21,23,30,.55);
  display:grid;place-items:center;padding:18px}
.pic{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:14px;max-width:min(92vw,980px);max-height:88%;overflow:auto;box-shadow:var(--lift)}
.pictop{margin:2px 4px 10px;font-size:13.5px;color:var(--ink-2)}
.pictop #picname{display:block;font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:3px}
.pic img{display:block;max-width:100%;border:1px solid var(--line);border-radius:var(--r-sm)}
.pic .txtbtn{margin-top:11px}
.txtbtn{background:none;border:1px solid var(--line);color:var(--ink-2);border-radius:var(--r-pill);
  padding:6px 13px;font:inherit;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;cursor:pointer}
.txtbtn:hover{color:var(--ink);border-color:var(--accent)}

.wrap{flex:1;position:relative;min-height:0;background:var(--paper)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:default}
#typing{position:absolute;display:none;border:1px solid var(--accent);border-radius:var(--r-sm);
  background:var(--surface);color:var(--ink);font-family:var(--body);padding:3px 7px;
  outline:none;min-width:130px}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);pointer-events:none;
  font-size:12px;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-pill);padding:5px 14px;opacity:.92}
@media (max-width:820px){ .grp + .grp{padding-left:8px} .hint{display:none} }
</style>

<div class="bar">
  <div class="grp" id="tools"></div>

  <div class="grp" id="colors"></div>

  <div class="grp" id="widths"></div>

  <div class="grp">
    <button class="t" id="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="t" id="redo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  </div>

  <div class="grp">
    <button class="t" id="zout" title="Zoom out (Ctrl and minus)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/><path d="M8 11h6"/></svg></button>
    <button class="zlabel" id="zlabel" title="Back to 100%">100%</button>
    <button class="t" id="zin" title="Zoom in (Ctrl and plus)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/><path d="M8 11h6"/><path d="M11 8v6"/></svg></button>
    <button class="t" id="zfit" title="Fit everything on screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg></button>
  </div>

  <span class="spacer"></span>
  <button class="txtbtn" id="home" hidden>back to top</button>
  <div class="savewrap">
    <button class="txtbtn" id="save">save png &#9662;</button>
    <div class="menu" id="savemenu" hidden>
      <p class="mhead" id="pagecount"></p>
      <button id="saveAll">Everything in one picture</button>
      <button id="savePages">Each page as its own picture</button>
      <button id="saveThis">Just the page I am looking at</button>
      <button id="showPic">Show me the picture to save by hand</button>
    </div>
  </div>
  <button class="txtbtn" id="clear">clear</button>
</div>

<div class="wrap" id="wrap">
  <canvas id="cv"></canvas>
  <input id="typing" spellcheck="false">
  <div class="shade" id="shade" hidden>
    <div class="pic">
      <p class="pictop">Right-click the picture and choose <b>Save image as</b>,
         or press and hold it on a phone.
         <span id="picname"></span></p>
      <img id="picimg" alt="Your board">
      <button class="txtbtn" id="picclose">close</button>
    </div>
  </div>

  <div class="hint" id="hint">V to select, drag a box round several &middot; scroll for more room, Ctrl+scroll to zoom &middot; Ctrl+C and Ctrl+V copy &middot; Ctrl+S saves</div>
</div>

<script>
/* ---------------------------------------------------------------
   A whiteboard for explaining things on a call.

   Everything drawn is kept as an OBJECT in one list, not painted
   straight onto pixels. That is what makes undo, redo and rubbing
   out one wrong box (while leaving the rest) possible at all - a
   pixel canvas can only be wiped. The canvas is redrawn from the
   list whenever the list changes.
--------------------------------------------------------------- */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const wrap = document.getElementById("wrap");
const typing = document.getElementById("typing");

let shapes = [];          // everything on the board, in draw order
let tool = "select";
let picked = [];          // the shapes currently picked up
let drawing = null;       // the shape being drawn right now

/* The board is bigger than the window and can be looked at from further
   away. cam is where the window is looking and how far in; everything in
   shapes is stored in BOARD coordinates, and the only places the two
   meet are at() and paint().

   board -> screen :  (v - cam.x) * cam.z
   screen -> board :  cam.x + sx / cam.z                                */
let cam = { x: 0, y: 0, z: 1 };
const ZMIN = 0.15, ZMAX = 4;

/* A page is the piece of board that fits on one printed picture. The
   board is tiled with them from the origin, so "page 3" means the same
   rectangle every time rather than wherever she happened to stop. */
const PAGE = { w: 1240, h: 880 };
let clipboard = [];

/* The default ink is whatever the theme calls "ink", so the pen is dark on
   the light board and light on the dark one. A hard-coded near-black pen
   is invisible the moment she switches theme. */
const INK = (getComputedStyle(document.documentElement)
  .getPropertyValue("--ink") || "#1A1D21").trim();
let color = INK;
let width = 3;

const TOOLS = [
  ["select",  "Select, move, resize (1, or V)",
   '<path d="M5 3l6 16 2.2-6.4L19.6 10Z"/>'],
  ["pen",     "Pen (2)",      '<path d="M4 20s1-4 2-5l9-9a2.1 2.1 0 0 1 3 3l-9 9c-1 1-5 2-5 2Z"/><path d="m13.5 5.5 5 5"/>'],
  ["line",    "Line (3)",     '<path d="M5 19 19 5"/>'],
  ["arrow",   "Arrow (4)",    '<path d="M5 19 19 5"/><path d="M12 5h7v7"/>'],
  ["rect",    "Box (5)",      '<rect x="4" y="6" width="16" height="12" rx="1.5"/>'],
  ["ellipse", "Circle (6)",   '<ellipse cx="12" cy="12" rx="8" ry="6.5"/>'],
  ["diamond", "Decision (7)", '<path d="M12 4 20 12 12 20 4 12Z"/>'],
  ["text",    "Text (8)",     '<path d="M5 6h14"/><path d="M12 6v13"/>'],
  ["erase",   "Rub out (9)",  '<path d="M8 20h12"/><path d="m4.5 15.5 5-5 7 7-3 3H7.5Z"/><path d="m9.5 10.5 5-5 7 7-5 5"/>'],
  ["hand",    "Scroll the board (0, or hold Space)",
   '<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 12V4.5a1.5 1.5 0 0 1 3 0V12"/><path d="M14 12V6.5a1.5 1.5 0 0 1 3 0V13"/><path d="M17 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-5.3-3.2L5 13.7a1.5 1.5 0 0 1 2.6-1.5L8.6 14"/>']
];
const COLORS = [INK, "#B5541F", "#0F7B6C", "#2F62B8", "#A57C1B"];
const WIDTHS = [2, 3, 6];
const CURSOR = { select: "default", hand: "grab", erase: "cell", text: "text" };

/* ---------- toolbar ---------- */
const tw = document.getElementById("tools");
TOOLS.forEach(([id, title, path]) => {
  const b = document.createElement("button");
  b.className = "t" + (id === tool ? " on" : "");
  b.title = title;
  b.dataset.tool = id;
  b.innerHTML = `<svg viewBox="0 0 24 24">${path}</svg>`;
  b.onclick = () => setTool(id);
  tw.appendChild(b);
});
const cw = document.getElementById("colors");
cw.innerHTML = `<span class="lbl">ink</span>`;
COLORS.forEach(c => {
  const b = document.createElement("button");
  b.className = "sw" + (c === color ? " on" : "");
  b.style.background = c;
  b.dataset.c = c;
  b.onclick = () => {
    color = c;
    cw.querySelectorAll(".sw").forEach(x => x.classList.toggle("on", x.dataset.c === c));
    /* a colour chosen with something selected recolours it, which is what
       anyone expects after picking a shape up */
    if (picked.length){ pushHistory(); picked.forEach(s => s.c = c); paint(); }
  };
  cw.appendChild(b);
});
const ww = document.getElementById("widths");
WIDTHS.forEach(w => {
  const b = document.createElement("button");
  b.className = "wt" + (w === width ? " on" : "");
  b.dataset.w = w;
  b.title = w + "px";
  b.innerHTML = `<i style="width:${w + 3}px;height:${w + 3}px"></i>`;
  b.onclick = () => {
    width = w;
    ww.querySelectorAll(".wt").forEach(x => x.classList.toggle("on", +x.dataset.w === w));
    if (picked.length){ pushHistory(); picked.forEach(s => { if (s.t !== "text") s.w = w; }); paint(); }
  };
  ww.appendChild(b);
});

function setTool(id){
  tool = id;
  if (id !== "select") picked = [];
  tw.querySelectorAll(".t").forEach(b => b.classList.toggle("on", b.dataset.tool === id));
  cv.style.cursor = CURSOR[id] || "crosshair";
  paint();
}

/* ---------- canvas size ---------- */
function resize(){
  const r = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  paint();
}
addEventListener("resize", resize);

/* ---------- drawing ---------- */
function stroke(g, s){
  g.strokeStyle = s.c;
  g.fillStyle = s.c;
  g.lineWidth = s.w;
  g.lineCap = "round";
  g.lineJoin = "round";
}

/* g defaults to the live canvas; the PNG export passes its own, which is
   why every drawing call below goes through g and never through ctx. */
function drawShape(s, g){
  g = g || ctx;
  stroke(g, s);
  if (s.t === "pen"){
    const p = s.pts;
    if (p.length < 2){
      g.beginPath(); g.arc(p[0].x, p[0].y, s.w / 2, 0, 7); g.fill(); return;
    }
    /* Through the midpoints with quadratic curves. Joining the raw
       points instead gives the visible hand-shake that makes a board
       look amateur; this is what "smooth" actually means here. */
    g.beginPath();
    g.moveTo(p[0].x, p[0].y);
    for (let i = 1; i < p.length - 1; i++){
      const mx = (p[i].x + p[i + 1].x) / 2, my = (p[i].y + p[i + 1].y) / 2;
      g.quadraticCurveTo(p[i].x, p[i].y, mx, my);
    }
    g.lineTo(p[p.length - 1].x, p[p.length - 1].y);
    g.stroke();
    return;
  }
  if (s.t === "text"){
    g.font = `${s.size}px "Public Sans", system-ui, sans-serif`;
    g.textBaseline = "top";
    g.fillText(s.s, s.x, s.y);
    return;
  }
  const { x0, y0, x1, y1 } = s;
  g.beginPath();
  if (s.t === "line" || s.t === "arrow"){
    g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    if (s.t === "arrow"){
      const a = Math.atan2(y1 - y0, x1 - x0), h = Math.max(11, s.w * 3.4);
      g.beginPath();
      g.moveTo(x1, y1);
      g.lineTo(x1 - h * Math.cos(a - 0.42), y1 - h * Math.sin(a - 0.42));
      g.moveTo(x1, y1);
      g.lineTo(x1 - h * Math.cos(a + 0.42), y1 - h * Math.sin(a + 0.42));
      g.stroke();
    }
    return;
  }
  if (s.t === "rect"){
    const r = Math.min(7, Math.abs(x1 - x0) / 4, Math.abs(y1 - y0) / 4);
    if (g.roundRect) g.roundRect(x0, y0, x1 - x0, y1 - y0, r);
    else g.rect(x0, y0, x1 - x0, y1 - y0);
  } else if (s.t === "ellipse"){
    g.ellipse((x0 + x1) / 2, (y0 + y1) / 2,
      Math.abs(x1 - x0) / 2, Math.abs(y1 - y0) / 2, 0, 0, 7);
  } else if (s.t === "diamond"){
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    g.moveTo(mx, y0); g.lineTo(x1, my); g.lineTo(mx, y1); g.lineTo(x0, my);
    g.closePath();
  }
  g.stroke();
}

const ACCENT = () => getComputedStyle(document.documentElement)
  .getPropertyValue("--accent").trim() || "#3A42DB";

/* ---------- pages ----------
   Faint guides, so she can see where one picture ends and the next
   begins before she saves rather than afterwards. */
function pageOf(x, y){ return { col: Math.floor(x / PAGE.w), row: Math.floor(y / PAGE.h) }; }

/* every page that has something on it, numbered in reading order */
function usedPages(){
  if (!shapes.length) return [{ n:1, col:0, row:0 }];
  let c0 = Infinity, r0 = Infinity, c1 = -Infinity, r1 = -Infinity;
  const cells = new Set();
  shapes.forEach(s => {
    const [a, b, c, d] = box(s);
    const p0 = pageOf(a, b), p1 = pageOf(c, d);
    for (let col = p0.col; col <= p1.col; col++)
      for (let row = p0.row; row <= p1.row; row++){
        cells.add(col + "," + row);
        c0 = Math.min(c0, col); r0 = Math.min(r0, row);
        c1 = Math.max(c1, col); r1 = Math.max(r1, row);
      }
  });
  const out = [];
  let n = 1;
  for (let row = r0; row <= r1; row++)
    for (let col = c0; col <= c1; col++)
      if (cells.has(col + "," + row)) out.push({ n: n++, col, row });
  return out;
}
const pageBox = p => [p.col * PAGE.w, p.row * PAGE.h,
                      (p.col + 1) * PAGE.w, (p.row + 1) * PAGE.h];

function drawPages(){
  const r = wrap.getBoundingClientRect();
  const x0 = cam.x, y0 = cam.y;
  const x1 = cam.x + r.width / cam.z, y1 = cam.y + r.height / cam.z;
  const used = {};
  usedPages().forEach(p => { used[p.col + "," + p.row] = p.n; });

  ctx.save();
  ctx.lineWidth = 1 / cam.z;
  ctx.strokeStyle = getComputedStyle(document.documentElement)
    .getPropertyValue("--line").trim() || "#ddd";
  ctx.fillStyle = getComputedStyle(document.documentElement)
    .getPropertyValue("--ink-3").trim() || "#888";
  ctx.font = `${13 / cam.z}px "JetBrains Mono", monospace`;
  ctx.textBaseline = "top";
  for (let col = Math.floor(x0 / PAGE.w); col <= Math.floor(x1 / PAGE.w); col++){
    for (let row = Math.floor(y0 / PAGE.h); row <= Math.floor(y1 / PAGE.h); row++){
      const bx = col * PAGE.w, by = row * PAGE.h;
      ctx.setLineDash([6 / cam.z, 6 / cam.z]);
      ctx.strokeRect(bx, by, PAGE.w, PAGE.h);
      ctx.setLineDash([]);
      const n = used[col + "," + row];
      if (n) ctx.fillText("page " + n, bx + 12 / cam.z, by + 10 / cam.z);
    }
  }
  ctx.restore();
}

/* ---------- the selection ---------- */
function selBox(){
  if (!picked.length) return null;
  const bs = picked.map(box);
  return [Math.min(...bs.map(v => v[0])), Math.min(...bs.map(v => v[1])),
          Math.max(...bs.map(v => v[2])), Math.max(...bs.map(v => v[3]))];
}

/* the dashed outline and the little squares you drag */
function drawSelection(){
  if (!picked.length) return;
  const [a, b, c, d] = selBox();
  const pad = 6 * px();
  ctx.save();
  ctx.strokeStyle = ACCENT();
  ctx.lineWidth = 1.2 * px();
  ctx.setLineDash([5 * px(), 4 * px()]);
  ctx.strokeRect(a - pad, b - pad, c - a + pad * 2, d - b + pad * 2);
  /* with several picked up, outline each one faintly too, so it is
     obvious what is in the group and what is not */
  if (picked.length > 1){
    ctx.globalAlpha = .45;
    picked.forEach(s => {
      const [e, f, g, h] = box(s);
      ctx.strokeRect(e - 2 * px(), f - 2 * px(), g - e + 4 * px(), h - f + 4 * px());
    });
    ctx.globalAlpha = 1;
  }
  ctx.setLineDash([]);
  ctx.fillStyle = "#fff";
  const hs = HS * px();
  handles().forEach(h => {
    ctx.beginPath();
    ctx.rect(h.x - hs / 2, h.y - hs / 2, hs, hs);
    ctx.fill(); ctx.stroke();
  });
  ctx.restore();
}

/* the rubber band you drag across things to pick them up */
let marquee = null;
function drawMarquee(){
  if (!marquee) return;
  const r = wrap.getBoundingClientRect();
  ctx.save();
  ctx.strokeStyle = ACCENT();
  ctx.fillStyle = ACCENT() + "22";
  ctx.lineWidth = 1.2;
  ctx.setLineDash([4, 3]);
  const a = (marquee.x0 - cam.x) * cam.z, b = (marquee.y0 - cam.y) * cam.z;
  const c = (marquee.x1 - cam.x) * cam.z, d = (marquee.y1 - cam.y) * cam.z;
  ctx.fillRect(a, b, c - a, d - b);
  ctx.strokeRect(a, b, c - a, d - b);
  ctx.restore();
}

function paint(){
  const r = wrap.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  ctx.save();
  ctx.scale(cam.z, cam.z);
  ctx.translate(-cam.x, -cam.y);
  drawPages();
  /* an arrow, not a bare reference: forEach passes the index as the
     second argument, which would arrive as the target context */
  shapes.forEach(s => drawShape(s));
  if (drawing) drawShape(drawing);
  drawSelection();
  ctx.restore();
  document.getElementById("undo").disabled = !past.length;
  document.getElementById("redo").disabled = !future.length;
  drawMarquee();
  document.getElementById("home").hidden = cam.x === 0 && cam.y === 0 && cam.z === 1;
  const zl = document.getElementById("zlabel");
  if (zl) zl.textContent = Math.round(cam.z * 100) + "%";
  autosave();
}

/* ---------- where a shape is ---------- */
function box(s){
  if (s.t === "pen"){
    const xs = s.pts.map(p => p.x), ys = s.pts.map(p => p.y);
    return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
  }
  if (s.t === "text"){
    ctx.font = `${s.size}px "Public Sans", system-ui, sans-serif`;
    return [s.x, s.y, s.x + ctx.measureText(s.s).width, s.y + s.size * 1.2];
  }
  return [Math.min(s.x0, s.x1), Math.min(s.y0, s.y1),
          Math.max(s.x0, s.x1), Math.max(s.y0, s.y1)];
}
function hit(s, x, y){
  const pad = Math.max(8 * px(), (s.w || 3) * px());
  if (s.t === "pen") return s.pts.some(p => Math.hypot(p.x - x, p.y - y) < pad);
  const [a, b, c, d] = box(s);
  return x > a - pad && x < c + pad && y > b - pad && y < d + pad;
}
function topAt(x, y){
  for (let i = shapes.length - 1; i >= 0; i--) if (hit(shapes[i], x, y)) return shapes[i];
  return null;
}

/* ---------- the handles you drag ---------- */
const HS = 9;             // handle square, in SCREEN pixels
function handles(){
  if (!picked.length) return [];
  /* one line on its own has two ends and nothing in between - corner
     handles on a diagonal line would be a lie about what you are
     dragging. In a group it is just part of the box. */
  if (picked.length === 1){
    const s = picked[0];
    if (s.t === "line" || s.t === "arrow")
      return [{ k:"p0", x:s.x0, y:s.y0 }, { k:"p1", x:s.x1, y:s.y1 }];
  }
  const [a, b, c, d] = selBox();
  const mx = (a + c) / 2, my = (b + d) / 2;
  return [
    { k:"nw", x:a, y:b }, { k:"n", x:mx, y:b }, { k:"ne", x:c, y:b },
    { k:"w",  x:a, y:my },                      { k:"e", x:c, y:my },
    { k:"sw", x:a, y:d }, { k:"s", x:mx, y:d }, { k:"se", x:c, y:d }
  ];
}
function handleAt(x, y){
  const r = HS * px();
  return handles().find(h => Math.abs(h.x - x) <= r && Math.abs(h.y - y) <= r) || null;
}
/* does a shape fall inside the rubber band? */
function inRect(s, a, b, c, d){
  const [e, f, g, h] = box(s);
  return g >= Math.min(a, c) && e <= Math.max(a, c)
      && h >= Math.min(b, d) && f <= Math.max(b, d);
}

/* Put a shape into a new bounding box. Everything is expressed as a
   fraction of the old box, so one function resizes every kind. */
function fitToBox(s, ob, nb){
  const ow = ob[2] - ob[0], oh = ob[3] - ob[1];
  const nw = nb[2] - nb[0], nh = nb[3] - nb[1];
  const fx = ow < 0.001 ? 1 : nw / ow;
  const fy = oh < 0.001 ? 1 : nh / oh;
  const mapX = x => nb[0] + (x - ob[0]) * fx;
  const mapY = y => nb[1] + (y - ob[1]) * fy;

  if (s.t === "pen"){ s.pts = s.pts.map(p => ({ x: mapX(p.x), y: mapY(p.y) })); return; }
  if (s.t === "text"){
    s.x = nb[0];
    s.y = nb[1];
    s.size = Math.max(10, Math.round(s.size * fy));
    return;
  }
  s.x0 = mapX(s.x0); s.y0 = mapY(s.y0);
  s.x1 = mapX(s.x1); s.y1 = mapY(s.y1);
}

function nudge(s, dx, dy){
  if (s.t === "pen"){ s.pts.forEach(p => { p.x += dx; p.y += dy; }); return; }
  if (s.t === "text"){ s.x += dx; s.y += dy; return; }
  s.x0 += dx; s.y0 += dy; s.x1 += dx; s.y1 += dy;
}

/* ---------- history ----------
   Whole-board snapshots rather than a stack of shapes. Pushing and
   popping shapes could only undo a drawing; moving and resizing change
   a shape that is already there, and those have to be undoable too. */
let past = [], future = [];
const snap = () => JSON.stringify(shapes);
function pushHistory(){
  past.push(snap());
  if (past.length > 100) past.shift();
  future = [];
}
function restore(json){
  shapes = JSON.parse(json);
  picked = [];             // the old references point at shapes that are gone
  paint();
}
function commit(s){ pushHistory(); shapes.push(s); paint(); }
function undo(){ if (!past.length) return; future.push(snap()); restore(past.pop()); }
function redo(){ if (!future.length) return; past.push(snap()); restore(future.pop()); }
document.getElementById("undo").onclick = undo;
document.getElementById("redo").onclick = redo;
/* Asking with confirm() looked fine until the board was opened inside
   the artifact viewer, which never shows those dialogs and answers false
   for you - so Clear quietly did nothing. The question is asked on the
   button instead, which works everywhere. */
const clearBtn = document.getElementById("clear");
let clearTimer = null;
function disarmClear(){
  clearTimeout(clearTimer);
  clearBtn.textContent = "clear";
  clearBtn.classList.remove("danger");
}
clearBtn.onclick = () => {
  if (!shapes.length) return;
  if (!clearBtn.classList.contains("danger")){
    clearBtn.textContent = "tap again to wipe";
    clearBtn.classList.add("danger");
    clearTimer = setTimeout(disarmClear, 3500);
    return;
  }
  disarmClear();
  pushHistory();
  shapes = []; picked = [];
  paint();
  flash("Board wiped — Ctrl+Z brings it back");
};
document.getElementById("home").onclick = () => { cam = { x:0, y:0, z:1 }; paint(); };

/* ---------- pointer ---------- */
function at(e){
  const r = cv.getBoundingClientRect();
  return { x: cam.x + (e.clientX - r.left) / cam.z,
           y: cam.y + (e.clientY - r.top) / cam.z };
}
/* how many board units one screen pixel covers - handles and hit
   tolerances are measured on screen, so they divide by the zoom */
const px = () => 1 / cam.z;
let erasing = false;
let action = null;        // a move, a resize, or a pan in progress
let space = false;        // Space held: pan without changing tool

cv.addEventListener("pointerdown", e => {
  if (typing.style.display === "block") return placeText();
  cv.setPointerCapture(e.pointerId);
  const p = at(e);

  /* panning wins over everything: hand tool, held Space, middle button */
  if (tool === "hand" || space || e.button === 1){
    action = { mode:"pan", sx:e.clientX, sy:e.clientY, cx:cam.x, cy:cam.y };
    cv.style.cursor = "grabbing";
    return;
  }

  if (tool === "select"){
    const h = handleAt(p.x, p.y);
    if (h){
      action = { mode:"resize", k:h.k, moved:false,
                 orig: picked.map(s => JSON.parse(JSON.stringify(s))),
                 obs:  picked.map(box),
                 ob:   selBox() };
      return;
    }
    const s = topAt(p.x, p.y);
    if (s){
      if (e.shiftKey){
        /* shift adds to the group, or takes one back out of it */
        const i = picked.indexOf(s);
        if (i === -1) picked.push(s); else picked.splice(i, 1);
      } else if (!picked.includes(s)){
        picked = [s];
      }
      if (picked.length) action = { mode:"move", lx:p.x, ly:p.y, moved:false };
    } else {
      /* empty board: drag a box over the things you want */
      if (!e.shiftKey) picked = [];
      marquee = { x0:p.x, y0:p.y, x1:p.x, y1:p.y, add:e.shiftKey, base:picked.slice() };
    }
    paint();
    return;
  }

  if (tool === "erase"){ erasing = true; rubOut(p); return; }

  if (tool === "text"){
    const r = cv.getBoundingClientRect();
    typing.style.display = "block";
    typing.style.left = (p.x - cam.x) + "px";
    typing.style.top = (p.y - cam.y) + "px";
    typing.style.fontSize = (width * 5 + 8) + "px";
    typing.style.color = color;
    typing.value = "";
    typing.dataset.x = p.x; typing.dataset.y = p.y;
    setTimeout(() => typing.focus(), 0);
    return;
  }

  drawing = tool === "pen"
    ? { t: "pen", pts: [p], c: color, w: width }
    : { t: tool, x0: p.x, y0: p.y, x1: p.x, y1: p.y, c: color, w: width };
});

cv.addEventListener("pointermove", e => {
  if (action && action.mode === "pan"){
    cam.x = action.cx - (e.clientX - action.sx);
    cam.y = action.cy - (e.clientY - action.sy);
    paint();
    return;
  }
  const p = at(e);

  if (marquee){
    marquee.x1 = p.x; marquee.y1 = p.y;
    const got = shapes.filter(s => inRect(s, marquee.x0, marquee.y0, marquee.x1, marquee.y1));
    picked = marquee.add ? [...new Set([...marquee.base, ...got])] : got;
    paint();
    return;
  }

  if (action && action.mode === "move" && picked.length){
    if (!action.moved){ pushHistory(); action.moved = true; }
    const dx = p.x - action.lx, dy = p.y - action.ly;
    picked.forEach(s => nudge(s, dx, dy));
    action.lx = p.x; action.ly = p.y;
    paint();
    return;
  }

  if (action && action.mode === "resize" && picked.length){
    if (!action.moved){ pushHistory(); action.moved = true; }
    resizeTo(p, e.shiftKey);
    paint();
    return;
  }

  /* over a handle, show which way it will stretch */
  if (tool === "select" && !action){
    const h = handleAt(p.x, p.y);
    cv.style.cursor = h ? (CURSORS[h.k] || "pointer")
                        : (topAt(p.x, p.y) ? "move" : "default");
  }

  if (erasing){ rubOut(p); return; }
  if (!drawing) return;
  if (drawing.t === "pen"){
    const last = drawing.pts[drawing.pts.length - 1];
    /* drop near-duplicate points: fewer, further-apart points curve better */
    if (Math.hypot(p.x - last.x, p.y - last.y) > 1.6) drawing.pts.push(p);
  } else {
    drawing.x1 = p.x; drawing.y1 = p.y;
    if (e.shiftKey){
      // square / circle / perfectly flat line
      if (drawing.t === "line" || drawing.t === "arrow"){
        if (Math.abs(p.x - drawing.x0) > Math.abs(p.y - drawing.y0)) drawing.y1 = drawing.y0;
        else drawing.x1 = drawing.x0;
      } else {
        const d = Math.max(Math.abs(p.x - drawing.x0), Math.abs(p.y - drawing.y0));
        drawing.x1 = drawing.x0 + Math.sign(p.x - drawing.x0 || 1) * d;
        drawing.y1 = drawing.y0 + Math.sign(p.y - drawing.y0 || 1) * d;
      }
    }
  }
  paint();
});

const CURSORS = { nw:"nwse-resize", se:"nwse-resize", ne:"nesw-resize", sw:"nesw-resize",
                  n:"ns-resize", s:"ns-resize", e:"ew-resize", w:"ew-resize",
                  p0:"move", p1:"move" };

function resizeTo(p, square){
  const ob = action.ob, k = action.k;

  if (k === "p0" || k === "p1"){      // a line end follows the finger
    const s = picked[0];
    if (k === "p0"){ s.x0 = p.x; s.y0 = p.y; } else { s.x1 = p.x; s.y1 = p.y; }
    return;
  }

  let [a, b, c, d] = ob.slice();
  if (k.includes("n")) b = p.y;
  if (k.includes("s")) d = p.y;
  if (k.includes("w")) a = p.x;
  if (k.includes("e")) c = p.x;

  /* Shift keeps the proportions, measured from the corner you are not
     holding, so a circle stays a circle while it grows. */
  if (square && k.length === 2){
    const ow = ob[2] - ob[0], oh = ob[3] - ob[1];
    if (ow > 0.001 && oh > 0.001){
      const w2 = Math.abs(c - a), h2 = Math.abs(d - b);
      const f = Math.max(w2 / ow, h2 / oh);
      if (k.includes("w")) a = c - ow * f; else c = a + ow * f;
      if (k.includes("n")) b = d - oh * f; else d = b + oh * f;
    }
  }

  // never let a shape turn inside out or collapse to nothing
  const MIN = 6;
  if (c - a < MIN){ if (k.includes("w")) a = c - MIN; else c = a + MIN; }
  if (d - b < MIN){ if (k.includes("n")) b = d - MIN; else d = b + MIN; }

  /* Everything moves through the SAME transform: each shape goes back to
     how it was, then its own old box is mapped through the group's old
     box to the group's new one. One shape or twenty, same arithmetic. */
  const ow = ob[2] - ob[0], oh = ob[3] - ob[1];
  const fx = ow < 0.001 ? 1 : (c - a) / ow;
  const fy = oh < 0.001 ? 1 : (d - b) / oh;
  picked.forEach((s, i) => {
    const o = action.orig[i], sb = action.obs[i];
    Object.assign(s, JSON.parse(JSON.stringify(o)));
    fitToBox(s, sb, [a + (sb[0] - ob[0]) * fx, b + (sb[1] - ob[1]) * fy,
                     a + (sb[2] - ob[0]) * fx, b + (sb[3] - ob[1]) * fy]);
  });
}

function end(){
  erasing = false;
  if (marquee){ marquee = null; paint(); return; }
  if (action){
    if (action.mode === "pan") cv.style.cursor = CURSOR[tool] || "crosshair";
    action = null;
    paint();
    return;
  }
  if (!drawing) return;
  const s = drawing;
  drawing = null;
  // ignore an accidental tap that drew nothing
  const tiny = s.t !== "pen" && Math.hypot(s.x1 - s.x0, s.y1 - s.y0) < 4;
  if (tiny) return paint();
  commit(s);
}
cv.addEventListener("pointerup", end);
cv.addEventListener("pointercancel", end);
cv.addEventListener("pointerleave", () => { erasing = false; });

/* ---------- scrolling and zooming ---------- */
cv.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey){
    /* zoom towards the pointer, so the thing under it stays put -
       zooming to the middle of the screen loses your place */
    const r = cv.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.pow(0.9992, e.deltaY));
    return;
  }
  /* the wheel moves the board by screen pixels whatever the zoom */
  if (e.shiftKey){ cam.x += e.deltaY / cam.z; }
  else { cam.x += e.deltaX / cam.z; cam.y += e.deltaY / cam.z; }
  paint();
}, { passive: false });

function zoomAt(sx, sy, factor){
  const z = Math.min(ZMAX, Math.max(ZMIN, cam.z * factor));
  if (z === cam.z) return;
  /* keep the board point under (sx,sy) exactly where it is */
  const wx = cam.x + sx / cam.z, wy = cam.y + sy / cam.z;
  cam.z = z;
  cam.x = wx - sx / cam.z;
  cam.y = wy - sy / cam.z;
  paint();
}
function zoomBy(factor){
  const r = wrap.getBoundingClientRect();
  zoomAt(r.width / 2, r.height / 2, factor);
}
/* pull back until everything drawn is on screen at once */
function zoomToFit(){
  const r = wrap.getBoundingClientRect();
  if (!shapes.length){ cam = { x:0, y:0, z:1 }; return paint(); }
  const bs = shapes.map(box);
  const a = Math.min(...bs.map(v => v[0])) - 60, b = Math.min(...bs.map(v => v[1])) - 60;
  const c = Math.max(...bs.map(v => v[2])) + 60, d = Math.max(...bs.map(v => v[3])) + 60;
  cam.z = Math.min(ZMAX, Math.max(ZMIN, Math.min(r.width / (c - a), r.height / (d - b))));
  cam.x = a - (r.width / cam.z - (c - a)) / 2;
  cam.y = b - (r.height / cam.z - (d - b)) / 2;
  paint();
}
document.getElementById("zin").onclick  = () => zoomBy(1.25);
document.getElementById("zout").onclick = () => zoomBy(0.8);
document.getElementById("zfit").onclick = zoomToFit;
document.getElementById("zlabel").onclick = () => { cam.z = 1; paint(); };

function rubOut(p){
  for (let i = shapes.length - 1; i >= 0; i--){
    if (hit(shapes[i], p.x, p.y)){
      pushHistory();
      picked = picked.filter(x => x !== shapes[i]);
      shapes.splice(i, 1);
      paint();
      return;
    }
  }
}

/* ---------- text ---------- */
function placeText(){
  const s = typing.value.trim();
  const size = parseFloat(typing.style.fontSize);
  if (s) commit({ t: "text", x: +typing.dataset.x + 4, y: +typing.dataset.y + 3,
                  s, c: typing.style.color || color, size, w: 3 });
  typing.style.display = "none";
  typing.value = "";
}
typing.addEventListener("keydown", e => {
  if (e.key === "Enter"){ e.preventDefault(); placeText(); }
  if (e.key === "Escape"){ typing.style.display = "none"; typing.value = ""; }
  e.stopPropagation();
});
typing.addEventListener("blur", placeText);

/* double-click a piece of text to edit the words again */
cv.addEventListener("dblclick", e => {
  const p = at(e);
  const s = topAt(p.x, p.y);
  if (!s || s.t !== "text") return;
  pushHistory();
  shapes.splice(shapes.indexOf(s), 1);
  picked = [];
  typing.style.display = "block";
  typing.style.left = (s.x - 4 - cam.x) + "px";
  typing.style.top = (s.y - 3 - cam.y) + "px";
  typing.style.fontSize = s.size + "px";
  typing.style.color = s.c;
  typing.value = s.s;
  typing.dataset.x = s.x - 4; typing.dataset.y = s.y - 3;
  paint();
  setTimeout(() => { typing.focus(); typing.select(); }, 0);
});

/* ---------- keyboard ---------- */
addEventListener("keydown", e => {
  if (e.target === typing) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z"){
    e.preventDefault();
    e.shiftKey ? redo() : undo();
    return;
  }
  if (e.code === "Space" && !space){
    space = true;
    cv.style.cursor = "grab";
    e.preventDefault();
    return;
  }
  if (e.key === "Escape"){ picked = []; marquee = null; paint(); return; }
  if ((e.key === "Delete" || e.key === "Backspace") && picked.length){
    e.preventDefault();
    pushHistory();
    shapes = shapes.filter(s => !picked.includes(s));
    picked = [];
    paint();
    return;
  }
  /* arrow keys nudge the selection, which is how you line two boxes up */
  if (picked.length && e.key.startsWith("Arrow")){
    e.preventDefault();
    const d = e.shiftKey ? 10 : 1;
    pushHistory();
    const dx = e.key === "ArrowLeft" ? -d : e.key === "ArrowRight" ? d : 0;
    const dy = e.key === "ArrowUp"   ? -d : e.key === "ArrowDown"  ? d : 0;
    picked.forEach(s => nudge(s, dx, dy));
    paint();
    return;
  }
  const k = e.key.toLowerCase();

  if (e.ctrlKey || e.metaKey){
    if (k === "c" && picked.length){
      clipboard = picked.map(s => JSON.parse(JSON.stringify(s)));
      e.preventDefault(); flash(picked.length + " copied"); return;
    }
    if (k === "x" && picked.length){
      clipboard = picked.map(s => JSON.parse(JSON.stringify(s)));
      pushHistory();
      shapes = shapes.filter(s => !picked.includes(s));
      picked = []; e.preventDefault(); paint(); flash("cut"); return;
    }
    if (k === "v" && clipboard.length){
      /* paste 24 board-units down and right, so the copy is visibly a
         copy rather than hiding exactly on top of the original */
      pushHistory();
      const copies = clipboard.map(s => JSON.parse(JSON.stringify(s)));
      copies.forEach(s => nudge(s, 24, 24));
      shapes.push(...copies);
      picked = copies;
      setTool("select");
      e.preventDefault(); paint(); return;
    }
    if (k === "a"){
      picked = shapes.slice(); setTool("select");
      e.preventDefault(); paint(); return;
    }
    if (k === "d" && picked.length){      // duplicate in place
      pushHistory();
      const copies = picked.map(s => JSON.parse(JSON.stringify(s)));
      copies.forEach(s => nudge(s, 24, 24));
      shapes.push(...copies);
      picked = copies;
      e.preventDefault(); paint(); return;
    }
    if (e.key === "=" || e.key === "+"){ zoomBy(1.25); e.preventDefault(); return; }
    if (e.key === "-"){ zoomBy(0.8);  e.preventDefault(); return; }
    if (e.key === "0"){ cam.z = 1; paint(); e.preventDefault(); return; }
  }

  if (k === "v") return setTool("select");
  if (k === "h") return setTool("hand");
  const n = parseInt(e.key, 10);
  if (e.key === "0") return setTool("hand");
  if (n >= 1 && n <= 9 && TOOLS[n - 1]) setTool(TOOLS[n - 1][0]);
});
addEventListener("keyup", e => {
  if (e.code === "Space"){ space = false; cv.style.cursor = CURSOR[tool] || "crosshair"; }
});

/* ---------- save ----------
   The whole board, not the window. She can scroll a long way down while
   explaining something, and a PNG of wherever she happened to stop would
   lose most of it. Flattened onto the paper colour too: a transparent
   PNG looks empty when it lands in WhatsApp on a dark theme. */
/* ---------- saving pictures ----------
   One picture of everything is right while the board is small, and
   wrong once she has drawn down three screens: the page guides exist so
   that "page 2" means a rectangle she can see before she saves, and
   each page can come out as its own picture.

   Note: a page inside the Claude artifact cannot start a download - the
   viewer blocks it. Saving works from the GitHub link and from
   localhost, which is where she will be drawing anyway. */
/* Draw the piece of board into its own canvas and hand back the image. */
function renderPNG(a, b, c, d){
  const out = document.createElement("canvas");
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  out.width  = Math.max(1, Math.round((c - a) * dpr));
  out.height = Math.max(1, Math.round((d - b) * dpr));
  const o = out.getContext("2d");
  o.setTransform(dpr, 0, 0, dpr, 0, 0);
  o.fillStyle = getComputedStyle(document.body).backgroundColor || "#fff";
  o.fillRect(0, 0, c - a, d - b);
  o.translate(-a, -b);
  /* clip so a shape that crosses onto the next page is cut at the edge
     rather than drawn outside the picture */
  o.beginPath(); o.rect(a, b, c - a, d - b); o.clip();
  shapes.forEach(sh => drawShape(sh, o));
  return out.toDataURL("image/png");
}

/* A page inside the artifact viewer is not allowed to start a download,
   and it is not told that it failed - the click simply does nothing. So
   every save also offers the picture itself, which can be saved by hand
   from any browser. */
function exportPNG(a, b, c, d, name){
  const url = renderPNG(a, b, c, d);
  lastPicture = { url, name };
  const link = document.createElement("a");
  link.download = name;
  link.href = url;
  link.click();
  return url;
}

let lastPicture = null;
const shade = document.getElementById("shade");
function showPicture(url, name){
  document.getElementById("picimg").src = url;
  document.getElementById("picname").textContent = name;
  shade.hidden = false;
}
document.getElementById("picclose").onclick = () => { shade.hidden = true; };
shade.addEventListener("click", e => { if (e.target === shade) shade.hidden = true; });

const stamp = () => new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");

function contentBox(){
  const r = wrap.getBoundingClientRect();
  if (!shapes.length) return [0, 0, r.width, r.height];
  const pad = 40;
  const bs = shapes.map(box);
  let a = Math.min(...bs.map(v => v[0])) - pad, b = Math.min(...bs.map(v => v[1])) - pad;
  let c = Math.max(...bs.map(v => v[2])) + pad, d = Math.max(...bs.map(v => v[3])) + pad;
  if (c - a < 320) c = a + 320;
  if (d - b < 240) d = b + 240;
  return [a, b, c, d];
}

function saveAll(){
  const [a, b, c, d] = contentBox();
  exportPNG(a, b, c, d, "whiteboard-" + stamp() + ".png");
  flash("Saved. Nothing downloaded? Use “Show me the picture”");
}
function savePages(){
  const pages = usedPages();
  /* one at a time: a browser that is asked for six downloads in the same
     tick usually keeps the first and drops the rest */
  pages.forEach((p, i) => setTimeout(() => {
    const [a, b, c, d] = pageBox(p);
    exportPNG(a, b, c, d, "whiteboard-" + stamp() + "-page-" + p.n + ".png");
  }, i * 350));
  flash(pages.length + (pages.length === 1 ? " page saved" : " pages saved, one picture each"));
}
function saveThisPage(){
  const r = wrap.getBoundingClientRect();
  const mid = { x: cam.x + r.width / (2 * cam.z), y: cam.y + r.height / (2 * cam.z) };
  const here = pageOf(mid.x, mid.y);
  const found = usedPages().find(p => p.col === here.col && p.row === here.row);
  const [a, b, c, d] = pageBox(here);
  exportPNG(a, b, c, d, "whiteboard-" + stamp() + "-page-" + (found ? found.n : 1) + ".png");
  flash("Saved. Nothing downloaded? Use “Show me the picture”");
}

/* the one that works everywhere: put the image on screen to save by hand */
function showAll(){
  const [a, b, c, d] = contentBox();
  showPicture(renderPNG(a, b, c, d), "whiteboard-" + stamp() + ".png");
}

const menu = document.getElementById("savemenu");
document.getElementById("save").onclick = e => {
  e.stopPropagation();
  menu.hidden = !menu.hidden;
  const n = usedPages().length;
  document.getElementById("pagecount").textContent =
    n === 1 ? "1 page has something on it" : n + " pages have something on them";
};
document.addEventListener("click", () => { menu.hidden = true; });
menu.addEventListener("click", e => e.stopPropagation());
document.getElementById("saveAll").onclick   = () => { menu.hidden = true; saveAll(); };
document.getElementById("savePages").onclick = () => { menu.hidden = true; savePages(); };
document.getElementById("saveThis").onclick  = () => { menu.hidden = true; saveThisPage(); };
document.getElementById("showPic").onclick   = () => { menu.hidden = true; showAll(); };

/* ---------- keeping the board ----------
   Everything already lives in one list of plain objects, so keeping it
   is JSON in and JSON out. It saves itself a moment after every change
   - the board is for a live call, and nobody remembers to press save
   while they are talking - and Ctrl+S saves at once and says so.

   This is this browser only. It survives closing the tab and the
   laptop; it does not travel to another machine. */
const STORE = "php_whiteboard_v1";
let saveTimer = null;

function store(){
  try {
    localStorage.setItem(STORE, JSON.stringify({ shapes, cam, at: Date.now() }));
    return true;
  } catch (e) { return false; }   // private window, or storage full
}
function autosave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(store, 600);
}
function load(){
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (Array.isArray(d.shapes)) shapes = d.shapes;
    if (d.cam) cam = { x:+d.cam.x || 0, y:+d.cam.y || 0,
                       z: Math.min(ZMAX, Math.max(ZMIN, +d.cam.z || 1)) };
  } catch (e) { /* unreadable: start on a clean board rather than break */ }
}

function flash(msg){
  const h = document.getElementById("hint");
  h.textContent = msg;
  h.style.display = "block";
  clearTimeout(flash.t);
  flash.t = setTimeout(() => { h.style.display = "none"; }, 1600);
}

addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){
    e.preventDefault();
    flash(store() ? "Board saved — it will be here when you come back"
                  : "This browser will not let the page save anything");
  }
});
addEventListener("beforeunload", store);

load();
setTool("select");
resize();
setTimeout(() => { document.getElementById("hint").style.display = "none"; }, 11000);
</script>
