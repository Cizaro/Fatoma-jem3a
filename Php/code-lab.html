<style>
/* Editor chrome only. These stay on this page rather than in the shared
   file because nothing else has a code gutter. --editor follows the
   cabinet colour so the editor matches every code block on the site. */
:root{ --editor-ink:#F2F1EE; --gutter:#6E757E; }



*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 40px}

header{padding-block:24px 6px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,5vw,32px);letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--accent)}
.hsub{color:var(--ink-2);font-size:13.5px}
.hbtns{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;background:none;border:1px solid var(--line);color:var(--ink-3);
  border-radius:var(--r-pill);padding:5px 12px;cursor:pointer}
.chip:hover{color:var(--ink);border-color:var(--accent)}
.chip.solved{border-color:var(--good);color:var(--good)}

/* layout */
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;margin-top:14px}
@media (max-width:860px){ .lab{grid-template-columns:minmax(0,1fr)} }
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.pane > header{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pane > header .t{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3)}
.body{padding:16px;overflow-y:auto}

/* brief */
.num{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--accent);
  letter-spacing:.08em;text-transform:uppercase}
.brief h2{font-family:var(--display);font-size:21px;letter-spacing:-.01em;margin:4px 0 10px}
.brief p{margin-bottom:10px;color:var(--ink-2)}
.brief ul,.brief ol{margin:0 0 12px 20px;color:var(--ink-2)}
.brief li{margin-bottom:4px}
.brief code{font-family:var(--mono);font-size:13px;background:var(--surface-2);
  padding:2px 6px;border-radius:var(--r-sm);color:var(--ink)}
.brief pre{background:var(--editor);color:var(--editor-ink);padding:12px 14px;border-radius:var(--r-sm);
  font-family:var(--mono);font-size:13px;line-height:1.65;overflow-x:auto;margin-bottom:12px}
.want{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.want b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);margin-bottom:6px}
.want pre{background:var(--surface);color:var(--ink);margin:0;font-size:13px;
  border:1px solid var(--line)}
.tip{background:var(--warm-soft);color:var(--warm);border-radius:var(--r-sm);padding:10px 13px;
  font-size:13.5px;margin-bottom:10px}

/* editor */
.edwrap{position:relative;background:var(--editor);flex:1;min-height:270px;display:flex}
.gutter{padding:14px 0 14px 12px;color:var(--gutter);font-family:var(--mono);font-size:14px;
  line-height:1.65;text-align:right;user-select:none;min-width:38px}
#code{flex:1;background:transparent;color:var(--editor-ink);border:0;outline:none;resize:none;
  padding:14px 14px 14px 10px;font-family:var(--mono);font-size:14px;line-height:1.65;
  white-space:pre;overflow-wrap:normal;overflow-x:auto;tab-size:4}
.bar{padding:11px 14px;border-top:1px solid var(--line);display:flex;gap:9px;
  align-items:center;flex-wrap:wrap;background:var(--surface-2)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:var(--r-sm);padding:10px 20px;
  font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{filter:brightness(1.1)}
.btn.run{background:var(--good)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.out{background:var(--editor);color:var(--editor-ink);font-family:var(--mono);font-size:13.5px;
  line-height:1.65;padding:14px;min-height:92px;max-height:260px;overflow:auto;white-space:pre-wrap;
  word-break:break-word}
.out .muted{color:var(--gutter)}
.out .err{color:#FF9A9A}
.verdict{padding:13px 16px;font-size:14.5px;display:none;border-top:1px solid var(--line)}
.verdict.show{display:block}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.verdict b{display:block;margin-bottom:4px}
.verdict ul{margin:6px 0 0 18px}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:560px){ .diff{grid-template-columns:1fr} }
.diff div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px}
.diff b{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.diff pre{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;margin-top:5px;color:var(--ink)}

/* picker */
.picker{position:fixed;inset:0;background:rgba(10,11,16,.55);display:none;
  align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;z-index:50}
.picker.show{display:flex}
.pcard{background:var(--surface);border-radius:var(--r-lg);max-width:660px;width:100%;
  box-shadow:var(--shadow);padding:22px}
.pcard h2{font-family:var(--display);font-size:21px;margin-bottom:3px}
.pcard .psub{color:var(--ink-2);font-size:13.5px;margin-bottom:14px}
.plist{display:grid;gap:7px;max-height:56vh;overflow-y:auto;padding-right:4px}
.pgroup{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3);margin-top:10px}
.pitem{display:flex;gap:10px;align-items:center;background:var(--surface-2);border:1px solid transparent;
  border-radius:var(--r-sm);padding:9px 12px;cursor:pointer;text-align:left;font-family:inherit;
  color:inherit;font-size:14px;width:100%}
.pitem:hover{border-color:var(--accent)}
.pitem.cur{border-color:var(--accent);background:var(--accent-soft)}
.pitem .mk{font-family:var(--mono);font-size:12px;color:var(--ink-3);min-width:26px}
.pitem.done .mk{color:var(--good)}
footer{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--ink-3);text-align:center}
footer a{color:var(--accent);text-decoration:none;margin:0 7px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ============================================================================
   THE CHALLENGES
   ========================================================================== */
const N = "\n";
const CH = [
{g:"Lesson 1 · echo and variables", id:"e1", title:"Say hello",
 brief:`<p>Every program starts here. Use <code>echo</code> to print a piece of text.</p>
        <p>Remember the three parts: the word <code>echo</code>, the text in quotes, and the
        semicolon at the end.</p>`,
 want:"Hello world",
 starter:`<?php\n// print Hello world\n`,
 tests:[{out:"Hello world"}],
 sol:`<?php\necho "Hello world";\n`},

{g:"Lesson 1 · echo and variables", id:"e2", title:"Three lines",
 brief:`<p>Print three lines. <code>\\n</code> means "new line", and it only works inside
        <b>double</b> quotes.</p>`,
 want:"one\ntwo\nthree",
 starter:`<?php\n`,
 tests:[{out:"one\ntwo\nthree"}],
 sol:`<?php\necho "one\\n";\necho "two\\n";\necho "three";\n`},

{g:"Lesson 1 · echo and variables", id:"e3", title:"Your first variable",
 brief:`<p>Put the text <code>Fatima</code> into a variable called <code>$name</code>,
        then print <code>Hello Fatima</code> using that variable.</p>
        <p>Don't type the name twice — the point is that the greeting comes from the box.</p>`,
 want:"Hello Fatima",
 starter:`<?php\n$name = \n`,
 tests:[{out:"Hello Fatima"}, {re:/\$name\s*=/, msg:"Store the name in a variable called $name"},
        {re:/echo[^;]*\$name/, msg:"Your echo must use $name, not the word Fatima"}],
 sol:`<?php\n$name = "Fatima";\necho "Hello $name";\n`},

{g:"Lesson 1 · echo and variables", id:"e4", title:"Glue it together",
 brief:`<p>Two variables are given to you. Print the full name with a space in the middle,
        using the dot operator.</p>
        <p>Careful: <code>$a . $b</code> gives <code>FatimaHassan</code>. You have to supply
        the space yourself.</p>`,
 want:"Fatima Hassan",
 starter:`<?php\n$first = "Fatima";\n$last = "Hassan";\n\n`,
 tests:[{out:"Fatima Hassan"}, {re:/\./, msg:"Use the dot operator to join them"}],
 sol:`<?php\n$first = "Fatima";\n$last = "Hassan";\n\necho $first . " " . $last;\n`},

{g:"Lesson 2 · types and strings", id:"t1", title:"Shout it",
 brief:`<p>Print the word in <code>$word</code> in capitals.</p>
        <p>You want <code>strtoupper()</code>.</p>`,
 want:"PROGRAMMING",
 starter:`<?php\n$word = "programming";\n\n`,
 tests:[{out:"PROGRAMMING"}, {re:/strtoupper/, msg:"Use strtoupper()"}],
 sol:`<?php\n$word = "programming";\n\necho strtoupper($word);\n`},

{g:"Lesson 2 · types and strings", id:"t2", title:"How long is it?",
 brief:`<p>Print the sentence, then how many characters it has, in this shape:</p>
        <pre>PHP is fun has 10 characters</pre>
        <p><code>strlen()</code> counts every character, spaces included.</p>`,
 want:"PHP is fun has 10 characters",
 starter:`<?php\n$s = "PHP is fun";\n\n`,
 tests:[{out:"PHP is fun has 10 characters"}, {re:/strlen/, msg:"Use strlen() — don't just type 10"}],
 sol:`<?php\n$s = "PHP is fun";\n\necho $s . " has " . strlen($s) . " characters";\n`},

{g:"Lesson 2 · types and strings", id:"t3", title:"Tidy the name",
 brief:`<p><code>$messy</code> has spaces round it and no capital letter. Print it clean:
        no spaces at the edges, first letter capital.</p>
        <p>You need two functions, one inside the other. Work out which runs first.</p>`,
 want:"Fatima",
 starter:`<?php\n$messy = "   fatima   ";\n\n`,
 tests:[{out:"Fatima"}, {re:/trim/, msg:"Use trim() to remove the spaces"},
        {re:/ucfirst/, msg:"Use ucfirst() for the capital letter"}],
 sol:`<?php\n$messy = "   fatima   ";\n\necho ucfirst(trim($messy));\n`},

{g:"Lesson 3 · operators", id:"o1", title:"The four sums",
 brief:`<p>Print the four operations on <code>$a</code> and <code>$b</code>, one per line,
        exactly in this shape:</p>
        <pre>24 + 7 = 31\n24 - 7 = 17\n24 * 7 = 168\n24 % 7 = 3</pre>
        <p>Remember maths does not happen inside quotes — use brackets.</p>`,
 want:"24 + 7 = 31\n24 - 7 = 17\n24 * 7 = 168\n24 % 7 = 3",
 starter:`<?php\n$a = 24;\n$b = 7;\n\n`,
 tests:[{out:"24 + 7 = 31\n24 - 7 = 17\n24 * 7 = 168\n24 % 7 = 3"},
        {re:/\$a\s*\+\s*\$b/, msg:"Calculate it from $a and $b — don't type the answers"}],
 sol:`<?php\n$a = 24;\n$b = 7;\n\necho "$a + $b = " . ($a + $b) . "\\n";\necho "$a - $b = " . ($a - $b) . "\\n";\necho "$a * $b = " . ($a * $b) . "\\n";\necho "$a % $b = " . ($a % $b);\n`},

{g:"Lesson 3 · operators", id:"o2", title:"Take the discount off",
 brief:`<p>A price and a discount percentage are given. Print the final price.</p>
        <p>100 with 25% off is 75.</p>`,
 want:"75",
 starter:`<?php\n$price = 100;\n$discount = 25;\n\n`,
 tests:[{out:"75"}, {re:/\$discount/, msg:"Work it out from $discount, don't hard-code 75"}],
 sol:`<?php\n$price = 100;\n$discount = 25;\n\necho $price - ($price * $discount / 100);\n`},

{g:"Lesson 4 · conditions", id:"c1", title:"Old enough?",
 brief:`<p>If <code>$age</code> is 18 or more print <code>adult</code>, otherwise print
        <code>child</code>.</p>
        <p>Try changing $age to 15 and running it again before you check.</p>`,
 want:"adult",
 starter:`<?php\n$age = 20;\n\n`,
 tests:[{out:"adult"}, {re:/if\s*\(/, msg:"Use an if"},
        {alt:{code:`$age = 12;`, out:"child"}, msg:"With $age = 12 it should print child"}],
 sol:`<?php\n$age = 20;\n\nif ($age >= 18) {\n    echo "adult";\n} else {\n    echo "child";\n}\n`},

{g:"Lesson 4 · conditions", id:"c2", title:"Even or odd",
 brief:`<p>Print <code>Even</code> or <code>Odd</code> for <code>$n</code>.</p>
        <p>The trick is <code>%</code>: if <code>$n % 2</code> is 0, it's even.</p>`,
 want:"Odd",
 starter:`<?php\n$n = 7;\n\n`,
 tests:[{out:"Odd"}, {re:/%/, msg:"Use the % operator"},
        {alt:{code:`$n = 10;`, out:"Even"}, msg:"With $n = 10 it should print Even"}],
 sol:`<?php\n$n = 7;\n\nif ($n % 2 == 0) {\n    echo "Even";\n} else {\n    echo "Odd";\n}\n`},

{g:"Lesson 4 · conditions", id:"c3", title:"The grade chain",
 brief:`<p>Print the letter grade for <code>$mark</code>:</p>
        <ul><li>18 or more → <code>A</code></li><li>16 or more → <code>B</code></li>
        <li>14 or more → <code>C</code></li><li>10 or more → <code>D</code></li>
        <li>anything else → <code>F</code></li></ul>
        <p class="tip">⚠️ The order of your conditions decides the answer. Strictest first.</p>`,
 want:"B",
 starter:`<?php\n$mark = 16;\n\n`,
 tests:[{out:"B"},
        {alt:{code:`$mark = 19;`, out:"A"}, msg:"19 must give A — if it gives D, your conditions are in the wrong order"},
        {alt:{code:`$mark = 11;`, out:"D"}, msg:"11 should give D"},
        {alt:{code:`$mark = 4;`, out:"F"}, msg:"4 should give F"}],
 sol:`<?php\n$mark = 16;\n\nif ($mark >= 18) {\n    echo "A";\n} elseif ($mark >= 16) {\n    echo "B";\n} elseif ($mark >= 14) {\n    echo "C";\n} elseif ($mark >= 10) {\n    echo "D";\n} else {\n    echo "F";\n}\n`},

{g:"Lesson 4 · conditions", id:"c4", title:"Two conditions",
 brief:`<p>A student passes only if the grade is 10 or more <b>and</b> attendance is 75 or more.
        Print <code>Passed</code> or <code>Failed</code>.</p>`,
 want:"Failed",
 starter:`<?php\n$grade = 14;\n$attendance = 60;\n\n`,
 tests:[{out:"Failed"}, {re:/&&/, msg:"Use && to join the two conditions"},
        {alt:{code:`$grade = 14;\n$attendance = 90;`, out:"Passed"}, msg:"14 and 90 should pass"}],
 sol:`<?php\n$grade = 14;\n$attendance = 60;\n\nif ($grade >= 10 && $attendance >= 75) {\n    echo "Passed";\n} else {\n    echo "Failed";\n}\n`},

{g:"Lesson 5 · loops", id:"l1", title:"Count to five",
 brief:`<p>Print the numbers 1 to 5, each on its own line, using a <code>for</code> loop.</p>`,
 want:"1\n2\n3\n4\n5",
 starter:`<?php\n`,
 tests:[{out:"1\n2\n3\n4\n5"}, {re:/for\s*\(/, msg:"Use a for loop, not five echo lines"}],
 sol:`<?php\nfor ($i = 1; $i <= 5; $i++) {\n    echo $i . "\\n";\n}\n`},

{g:"Lesson 5 · loops", id:"l2", title:"Backwards",
 brief:`<p>Count down from 5 to 1 on one line, separated by spaces, then the word
        <code>GO</code>.</p>`,
 want:"5 4 3 2 1 GO",
 starter:`<?php\n`,
 tests:[{out:"5 4 3 2 1 GO"}, {re:/for\s*\(|while\s*\(/, msg:"Use a loop"}],
 sol:`<?php\nfor ($i = 5; $i >= 1; $i--) {\n    echo $i . " ";\n}\necho "GO";\n`},

{g:"Lesson 5 · loops", id:"l3", title:"Add them all up",
 brief:`<p>Add up every number from 1 to 100 and print the total.</p>
        <p>Start your total at 0 <b>before</b> the loop. The answer is 5050 — if you get
        something close but not exact, your loop is off by one.</p>`,
 want:"5050",
 starter:`<?php\n$total = 0;\n\n`,
 tests:[{out:"5050"}, {re:/for\s*\(|while\s*\(/, msg:"Use a loop — don't just type 5050"}],
 sol:`<?php\n$total = 0;\n\nfor ($i = 1; $i <= 100; $i++) {\n    $total += $i;\n}\necho $total;\n`},

{g:"Lesson 5 · loops", id:"l4", title:"Times table",
 brief:`<p>Print the 7 times table, from 1 to 5, in this shape:</p>
        <pre>7 x 1 = 7\n7 x 2 = 14\n7 x 3 = 21\n7 x 4 = 28\n7 x 5 = 35</pre>`,
 want:"7 x 1 = 7\n7 x 2 = 14\n7 x 3 = 21\n7 x 4 = 28\n7 x 5 = 35",
 starter:`<?php\n$table = 7;\n\n`,
 tests:[{out:"7 x 1 = 7\n7 x 2 = 14\n7 x 3 = 21\n7 x 4 = 28\n7 x 5 = 35"},
        {re:/for\s*\(|while\s*\(/, msg:"Use a loop"}],
 sol:`<?php\n$table = 7;\n\nfor ($i = 1; $i <= 5; $i++) {\n    echo "$table x $i = " . ($table * $i) . "\\n";\n}\n`},

{g:"Lesson 5 · loops", id:"l5", title:"Skip and stop",
 brief:`<p>Loop from 1 to 10. <b>Skip</b> the number 4 entirely, and <b>stop</b> completely
        when you reach 8. Print the rest separated by spaces.</p>
        <p>You want <code>continue</code> and <code>break</code>.</p>`,
 want:"1 2 3 5 6 7",
 starter:`<?php\n`,
 tests:[{out:"1 2 3 5 6 7"}, {re:/continue/, msg:"Use continue to skip the 4"},
        {re:/break/, msg:"Use break to stop at 8"}],
 sol:`<?php\nfor ($i = 1; $i <= 10; $i++) {\n    if ($i == 4) continue;\n    if ($i == 8) break;\n    echo $i . " ";\n}\n`},

{g:"Lesson 5 · loops", id:"l6", title:"The triangle",
 brief:`<p>Print this, using a loop:</p><pre>*\n**\n***\n****\n*****</pre>
        <p><code>str_repeat("*", $i)</code> makes this short. A loop inside a loop also works.</p>`,
 want:"*\n**\n***\n****\n*****",
 starter:`<?php\n`,
 tests:[{out:"*\n**\n***\n****\n*****"}, {re:/for\s*\(|while\s*\(/, msg:"Use a loop"}],
 sol:`<?php\nfor ($i = 1; $i <= 5; $i++) {\n    echo str_repeat("*", $i) . "\\n";\n}\n`},

{g:"Lesson 5 · loops", id:"l7", title:"FizzBuzz",
 brief:`<p>The famous one. For 1 to 15:</p>
        <ul><li>divisible by 3 <b>and</b> 5 → <code>FizzBuzz</code></li>
        <li>divisible by 3 → <code>Fizz</code></li>
        <li>divisible by 5 → <code>Buzz</code></li>
        <li>otherwise → the number</li></ul>
        <p>One per line. <span class="tip" style="display:inline-block;margin:6px 0 0">
        Think hard about the order — get it wrong and 15 prints Fizz.</span></p>`,
 want:"1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz",
 starter:`<?php\n`,
 tests:[{out:"1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz"},
        {re:/for\s*\(|while\s*\(/, msg:"Use a loop"}],
 sol:`<?php\nfor ($i = 1; $i <= 15; $i++) {\n    if ($i % 3 == 0 && $i % 5 == 0) {\n        echo "FizzBuzz\\n";\n    } elseif ($i % 3 == 0) {\n        echo "Fizz\\n";\n    } elseif ($i % 5 == 0) {\n        echo "Buzz\\n";\n    } else {\n        echo $i . "\\n";\n    }\n}\n`},

{g:"Lesson 6 · arrays", id:"a1", title:"First and last",
 brief:`<p>Print the first colour, then the last one, separated by a space.</p>
        <p>Don't type index 2 — work the last index out from <code>count()</code>, so it still
        works if the list grows.</p>`,
 want:"red blue",
 starter:`<?php\n$colors = ["red", "green", "blue"];\n\n`,
 tests:[{out:"red blue"}, {re:/count\s*\(/, msg:"Use count() to find the last index"}],

{g:"Lesson 6 · arrays", id:"a2", title:"List them out",
 brief:`<p>Print every fruit on its own line, numbered:</p>
        <pre>1. apple\n2. banana\n3. grape</pre>
        <p>Use a <code>foreach</code>. The key starts at 0, so you'll need to add 1.</p>`,

{g:"Lesson 6 · arrays", id:"a4", title:"Read the record",

{g:"Lesson 6 · arrays", id:"a5", title:"Pass or fail",

        <pre>Fatima: Pass\nSara: Fail\nLina: Pass</pre>
        <p>This is an array of arrays — exactly what a database table looks like.</p>`,

{g:"Lesson 6 · arrays", id:"a6", title:"Count the letters",
 brief:`<p>Count how many times each letter appears in <code>$word</code> and print:</p>
        <pre>p=1\nr=2\no=1\ng=2\na=1\nm=2\ni=1\nn=1</pre>
        <p>Hints: <code>str_split()</code> gives you an array of letters. Build an associative
        array where the letter is the key. <code>isset()</code> tells you if a key exists yet.</p>`,
 want:"p=1\nr=2\no=1\ng=2\na=1\nm=2\ni=1\nn=1",
 starter:`<?php\n$word = "programming";\n$count = [];\n\n`,
 tests:[{out:"p=1\nr=2\no=1\ng=2\na=1\nm=2\ni=1\nn=1"}, {re:/foreach|for\s*\(/, msg:"Use a loop"}],
 sol:`<?php\n$word = "programming";\n$count = [];\n\nforeach (str_split($word) as $letter) {\n    if (isset($count[$letter])) {\n        $count[$letter] = $count[$letter] + 1;\n    } else {\n        $count[$letter] = 1;\n    }\n}\n\nforeach ($count as $letter => $n) {\n    echo "$letter=$n\\n";\n}\n`},

{g:"Lesson 7 · functions", id:"f1", title:"Write your first function",
 brief:`<p>Write a function called <code>square</code> that takes a number and
        <b>returns</b> it multiplied by itself. Then print <code>square(7)</code>.</p>
        <p class="tip">⚠️ <code>return</code>, not <code>echo</code>. The difference matters —
        the next challenge proves why.</p>`,
 want:"49",
 starter:`<?php\n// write the function here\n\n\necho square(7);\n`,
 tests:[{out:"49"}, {re:/function\s+square/i, msg:"Your function must be called square"},
        {re:/return/, msg:"It has to RETURN the answer, not echo it"}],
 sol:`<?php\nfunction square($n) {\n    return $n * $n;\n}\n\necho square(7);\n`},

{g:"Lesson 7 · functions", id:"f2", title:"Why return matters",
 brief:`<p>Using your <code>square</code> function, print the sum of
        <code>square(3)</code> and <code>square(4)</code>.</p>
        <p>This only works because the function returns. If it echoed, there would be nothing
        to add.</p>`,
 want:"25",
 starter:`<?php\nfunction square($n) {\n    return $n * $n;\n}\n\n`,
 tests:[{out:"25"}, {re:/square\s*\(\s*3\s*\)/, msg:"Call square(3)"},
        {re:/square\s*\(\s*4\s*\)/, msg:"Call square(4)"}],
 sol:`<?php\nfunction square($n) {\n    return $n * $n;\n}\n\necho square(3) + square(4);\n`},

{g:"Lesson 7 · functions", id:"f3", title:"A default value",
 brief:`<p>Write <code>discount($price, $percent = 10)</code> that returns the price after the
        discount. Then print both calls shown in the starter.</p>
        <p>The first should give 180 (the default 10%), the second 150.</p>`,
 want:"180\n150",
 starter:`<?php\n// write discount() here\n\n\necho discount(200) . "\\n";\necho discount(200, 25);\n`,
 tests:[{out:"180\n150"}, {re:/function\s+discount/i, msg:"Call the function discount"},
        {re:/=\s*10/, msg:"Give $percent a default value of 10"}],
 sol:`<?php\nfunction discount($price, $percent = 10) {\n    return $price - ($price * $percent / 100);\n}\n\necho discount(200) . "\\n";\necho discount(200, 25);\n`},

{g:"Lesson 7 · functions", id:"f4", title:"Count the vowels",
 brief:`<p>Write <code>countVowels($word)</code> that returns how many vowels (a e i o u)
        are in a word. Print the result for <code>Programming</code>.</p>
        <p>Hints: <code>strtolower()</code>, <code>str_split()</code>, <code>in_array()</code>.</p>`,
 want:"3",
 starter:`<?php\n// write countVowels() here\n\n\necho countVowels("Programming");\n`,
 tests:[{out:"3"}, {re:/function\s+countVowels/i, msg:"Call the function countVowels"},
        {re:/return/, msg:"It must return the count"}],
 sol:`<?php\nfunction countVowels($word) {\n    $vowels = ["a", "e", "i", "o", "u"];\n    $n = 0;\n    foreach (str_split(strtolower($word)) as $letter) {\n        if (in_array($letter, $vowels)) {\n            $n++;\n        }\n    }\n    return $n;\n}\n\necho countVowels("Programming");\n`},

{g:"Boss challenges", id:"b1", title:"The receipt",
 brief:`<p>Print a receipt. Every number must be <b>calculated</b> from the variables, and
        money shown to 2 decimal places with <code>number_format()</code>.</p>
        <pre>Item     : Notebook\nPrice    : 4.75\nQuantity : 3\nSubtotal : 14.25\nDiscount : 1.43\nTOTAL    : 12.83</pre>
        <p>Discount is 10% of the subtotal. Total is subtotal minus discount.</p>`,
 want:"Item     : Notebook\nPrice    : 4.75\nQuantity : 3\nSubtotal : 14.25\nDiscount : 1.43\nTOTAL    : 12.83",
 starter:`<?php\n$item = "Notebook";\n$price = 4.75;\n$qty = 3;\n$discountPct = 10;\n\n`,
 tests:[{out:"Item     : Notebook\nPrice    : 4.75\nQuantity : 3\nSubtotal : 14.25\nDiscount : 1.43\nTOTAL    : 12.83"},
        {re:/\$price\s*\*\s*\$qty|\$qty\s*\*\s*\$price/, msg:"Work the subtotal out from $price and $qty"}],

/* ============================================================================
   UI
   ========================================================================== */
const $ = id => document.getElementById(id);
const KEY = "phplab_v1";
let state = { solved:{}, code:{}, i:0, tries:0 };
try { const r = localStorage.getItem(KEY); if (r) state = Object.assign(state, JSON.parse(r)); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} };

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const cur = () => CH[state.i];

function gutter(){
  const lines = $("code").value.split("\n").length;
  $("gutter").textContent = Array.from({length:Math.max(lines,1)}, (_,i) => i+1).join("\n");
}

function load(i){
  state.i = Math.max(0, Math.min(CH.length - 1, i));
  state.tries = 0;
  const c = cur();
  $("crumb").textContent = `${c.g} — ${state.i+1} of ${CH.length}`;
  $("brief").innerHTML = `<div class="num">Challenge ${state.i+1}${state.solved[c.id] ? " · solved ✓" : ""}</div>
    <h2>${esc(c.title)}</h2>${c.brief}
    <div class="want"><b>Expected output</b><pre>${esc(c.want)}</pre></div>`;
  $("code").value = state.code[c.id] !== undefined ? state.code[c.id] : c.starter;
  $("out").innerHTML = '<span class="muted">Output appears here when you press Run.</span>';
  $("verdict").className = "verdict";
  $("hintCount").textContent = "";
  $("prevBtn").disabled = state.i === 0;
  $("nextBtn").disabled = state.i === CH.length - 1;
  gutter(); save();
}

function exec(code){
  const warns = [];
  try {
    const out = PHP.run(code, { warn: w => warns.push(w) });
    return { out, warns };
  } catch(e){
    return { out:null, warns, error: (e.line ? `Parse error on line ${e.line}: ` : "Error: ") + e.message };
  }
}

function showOut(r){
  if (r.error){ $("out").innerHTML = `<span class="err">${esc(r.error)}</span>`; return; }
  let html = "";
  if (r.warns.length) html += `<span class="err">${esc(r.warns.join("\n"))}\n</span>`;
  html += r.out === "" ? '<span class="muted">(nothing was printed)</span>' : esc(r.out);
  $("out").innerHTML = html;
}

$("runBtn").onclick = () => {
  const c = cur();
  state.code[c.id] = $("code").value; save();
  showOut(exec($("code").value));
  $("verdict").className = "verdict";
};

$("checkBtn").onclick = () => {
  const c = cur(), code = $("code").value;
  state.code[c.id] = code; save();
  const r = exec(code);
  showOut(r);
  const v = $("verdict");

  if (r.error){
    v.className = "verdict show no";
    v.innerHTML = `<b>It didn't run</b>${esc(r.error)}<br><span style="opacity:.8">
      Fix the error first — the check can't judge code that won't run.</span>`;
    state.tries++; hintIfStuck(); return;
  }

  const fails = [];
  for (const t of c.tests){
    if (t.out !== undefined){
      if (r.out.replace(/[ \t]+$/gm,"").trimEnd() !== t.out.trimEnd())
        fails.push({diff:true, got:r.out, want:t.out});
    } else if (t.re){
      if (!t.re.test(code)) fails.push({msg:t.msg});
    } else if (t.alt){
      const swapped = code.replace(/^\s*\$\w+\s*=[^;]*;\s*$/gm, m => {
        const name = m.trim().split("=")[0].trim();
        const rep = t.alt.code.split("\n").find(l => l.trim().startsWith(name));
        return rep !== undefined ? rep : m;
      });
      const r2 = exec(swapped);
      if (r2.error || r2.out.trimEnd() !== t.alt.out.trimEnd()) fails.push({msg:t.msg});
    }
  }

  if (!fails.length){
    state.solved[c.id] = 1; save();
    const done = Object.keys(state.solved).length;
    v.className = "verdict show ok";
    v.innerHTML = `<b>✅ Correct</b>That's ${done} of ${CH.length} solved.` +
      (state.i < CH.length-1 ? ` <button class="btn" style="margin-left:8px;padding:6px 14px"
         onclick="window.__next()">next challenge →</button>` : " You've finished every challenge.");
    $("brief").querySelector(".num").textContent = `Challenge ${state.i+1} · solved ✓`;
  } else {
    state.tries++;
    v.className = "verdict show no";
    const d = fails.find(f => f.diff);
    v.innerHTML = `<b>❌ Not yet</b>` +
      (fails.filter(f => f.msg).length
        ? `<ul>${fails.filter(f=>f.msg).map(f=>`<li>${esc(f.msg)}</li>`).join("")}</ul>` : "") +
      (d ? `<div class="diff">
        <div><b>your output</b><pre>${esc(d.got) || "<i>nothing</i>"}</pre></div>
        <div><b>expected</b><pre>${esc(d.want)}</pre></div></div>` : "");
    hintIfStuck();
  }
};
window.__next = () => load(state.i + 1);

function hintIfStuck(){
  $("hintCount").textContent = state.tries >= 3
    ? "stuck? the solution button is there"
    : `${3 - state.tries} more ${3-state.tries===1?"try":"tries"} before the solution unlocks`;
}

$("solBtn").onclick = () => {
  if (state.tries < 3 && !state.solved[cur().id]){
    alert("Try it at least three times first. Struggling is where it sticks — the button unlocks after that.");
    return;
  }
  if (!confirm("Show the solution? Read it, close it, then type it yourself — don't paste.")) return;
  $("code").value = cur().sol; gutter();
  $("out").innerHTML = '<span class="muted">This is one correct answer. Run it, then rewrite it yourself.</span>';
};
$("resetBtn").onclick = () => { $("code").value = cur().starter; gutter(); };
$("prevBtn").onclick = () => load(state.i - 1);
$("nextBtn").onclick = () => load(state.i + 1);

/* editor niceties */
const ta = $("code");
ta.addEventListener("input", gutter);
ta.addEventListener("scroll", () => { $("gutter").scrollTop = ta.scrollTop; });
ta.addEventListener("keydown", e => {
  if (e.key === "Tab"){
    e.preventDefault();
    const s = ta.selectionStart, en = ta.selectionEnd;
    ta.value = ta.value.slice(0,s) + "    " + ta.value.slice(en);
    ta.selectionStart = ta.selectionEnd = s + 4; gutter();
  }
  if (e.key === "Enter"){            // keep the indent of the line you're on
    const s = ta.selectionStart;
    const lineStart = ta.value.lastIndexOf("\n", s - 1) + 1;
    const indent = (ta.value.slice(lineStart, s).match(/^[ \t]*/) || [""])[0];
    const extra = /\{\s*$/.test(ta.value.slice(lineStart, s)) ? "    " : "";
    if (indent || extra){
      e.preventDefault();
      const ins = "\n" + indent + extra;
      ta.value = ta.value.slice(0,s) + ins + ta.value.slice(ta.selectionEnd);
      ta.selectionStart = ta.selectionEnd = s + ins.length; gutter();
    }
  }
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); $("runBtn").click(); }
});

/* challenge picker */
function picker(){
  const solved = Object.keys(state.solved).length;
  $("pstat").textContent = `${solved} of ${CH.length} solved`;
  let html = "", g = null;
  CH.forEach((c, i) => {
    if (c.g !== g){ g = c.g; html += `<div class="pgroup">${esc(g)}</div>`; }
    html += `<button class="pitem${i===state.i?" cur":""}${state.solved[c.id]?" done":""}" data-i="${i}">
      <span class="mk">${state.solved[c.id] ? "✓" : i+1}</span><span>${esc(c.title)}</span></button>`;
  });
  $("plist").innerHTML = html;
  $("plist").querySelectorAll("[data-i]").forEach(b =>
    b.onclick = () => { load(+b.dataset.i); $("picker").classList.remove("show"); });
  $("picker").classList.add("show");
}
$("pickBtn").onclick = picker;
$("closePick").onclick = () => $("picker").classList.remove("show");
$("picker").onclick = e => { if (e.target === $("picker")) $("picker").classList.remove("show"); };
$("wipe").onclick = () => {
  if (!confirm("Forget every solved challenge and all your saved code?")) return;
  state = { solved:{}, code:{}, i:0, tries:0 }; save();
  $("picker").classList.remove("show"); load(0);
};

$("themeBtn").onclick = () => {
  const c = document.documentElement.getAttribute("data-theme");
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const n = c ? (c === "dark" ? "light" : "dark") : (dark ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", n);
  try { localStorage.setItem("phplab_theme", n); } catch(e){}
};
try { const t = localStorage.getItem("phplab_theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch(e){}

load(state.i);
</script>
