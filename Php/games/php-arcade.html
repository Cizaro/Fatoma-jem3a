<!doctype html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PHP Arcade</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* ONE design system across the whole course: index.html, stages.html, code-lab.html,
   flashcards.html, roadmap.html, exam-simulator.html and this page.
   Change a token here and change it in all of them. */
:root{
  --paper:#F7F6F3; --surface:#FFFFFF; --surface-2:#EFEDE8;
  --ink:#1A1D21; --ink-2:#5C6168; --ink-3:#8D939B;
  --line:#E2DFD8; --accent:#0F7B6C; --accent-soft:#E3F1EE;
  --warm:#B5541F; --warm-soft:#FBEDE4; --gold:#A57C1B; --gold-soft:#FBF2DC;
  --cabinet:#15181C; --cabinet-2:#1F242A; --cabinet-ink:#F2F1EE;
  --shadow:0 1px 2px rgba(26,29,33,.06), 0 10px 28px -14px rgba(26,29,33,.28);
  --lift:0 2px 4px rgba(26,29,33,.06), 0 18px 40px -20px rgba(26,29,33,.45);
  --display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14161A; --surface:#1D2126; --surface-2:#262B31;
    --ink:#ECEEF1; --ink-2:#A3A9B2; --ink-3:#787E88;
    --line:#30353C; --accent:#4FC2AE; --accent-soft:#16302C;
    --warm:#E08B5A; --warm-soft:#2E211A; --gold:#D8B45B; --gold-soft:#2C2517;
    --cabinet:#0E1013; --cabinet-2:#191D22; --cabinet-ink:#F2F1EE;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
    --lift:0 2px 4px rgba(0,0,0,.5), 0 18px 40px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#14161A; --surface:#1D2126; --surface-2:#262B31;
  --ink:#ECEEF1; --ink-2:#A3A9B2; --ink-3:#787E88;
  --line:#30353C; --accent:#4FC2AE; --accent-soft:#16302C;
  --warm:#E08B5A; --warm-soft:#2E211A; --gold:#D8B45B; --gold-soft:#2C2517;
  --cabinet:#0E1013; --cabinet-2:#191D22; --cabinet-ink:#F2F1EE;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  --lift:0 2px 4px rgba(0,0,0,.5), 0 18px 40px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;
  line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:60px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{padding-block:34px 20px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,6vw,42px);
  letter-spacing:-.03em;line-height:1}
h1 span{color:var(--accent)}
.tagline{color:var(--ink-2);font-size:14.5px;margin-top:3px}
.theme-btn{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;background:none;border:1px solid var(--line);
  color:var(--ink-3);border-radius:999px;padding:6px 12px;cursor:pointer}
.theme-btn:hover{color:var(--ink);border-color:var(--accent)}

/* ---- player strip: a rank, a ring, a badge count. Not a wall of padlocks ---- */
.player{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;margin-bottom:24px;box-shadow:var(--shadow)}
.ring{position:relative;width:62px;height:62px;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .t{stroke:var(--surface-2)}
.ring .f{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.16,1,.3,1)}
.ring b{font-family:var(--display);font-size:22px;line-height:1}
.who{flex:1;min-width:150px}
.who .rank{font-family:var(--display);font-size:19px;letter-spacing:-.01em;line-height:1.2}
.who .xp{color:var(--ink-3);font-size:12.5px;font-family:var(--mono);margin-top:3px}
.badgebtn{background:var(--gold-soft);border:1px solid var(--gold);color:var(--gold);
  border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:8px;white-space:nowrap}
.badgebtn:hover{filter:brightness(.97)}
.badgebtn .em{font-size:15px}

/* ---- the games: one featured, the rest in a rhythm. Never six equal boxes ---- */
.sec{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 11px}
.feature{display:block;width:100%;text-align:left;background:var(--cabinet);
  color:var(--cabinet-ink);border:0;border-radius:18px;padding:28px;cursor:pointer;
  box-shadow:var(--lift);position:relative;overflow:hidden;margin-bottom:26px;
  transition:transform .16s cubic-bezier(.16,1,.3,1)}
.feature:hover{transform:translateY(-3px)}
.feature:active{transform:translateY(0)}
.feature::after{content:"";position:absolute;right:-70px;top:-70px;width:270px;height:270px;
  border-radius:50%;background:radial-gradient(circle,rgba(79,194,174,.20),transparent 62%)}
.feature .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:#4FC2AE;font-weight:700;position:relative}
.feature h2{font-family:var(--display);font-size:clamp(26px,4.6vw,34px);letter-spacing:-.025em;
  margin:8px 0 6px;line-height:1.02;position:relative}
.feature p{color:#A8AEB6;font-size:14.5px;max-width:42ch;position:relative}
.feature .go{display:inline-flex;align-items:center;gap:8px;margin-top:18px;position:relative;
  background:#4FC2AE;color:#08110F;border-radius:11px;padding:12px 22px;
  font-weight:700;font-size:14.5px}
.feature .meta{position:absolute;right:28px;bottom:26px;text-align:right;
  font-family:var(--mono);font-size:11.5px;color:#7E858E;line-height:1.7}
.feature .meta b{color:#D8B45B;display:block;font-size:15px}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.game-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:17px 18px;cursor:pointer;text-align:left;color:inherit;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:2px;
  transition:transform .14s cubic-bezier(.16,1,.3,1),border-color .14s}
.game-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.game-card:active{transform:translateY(0)}
.game-card .icon{font-size:21px;line-height:1;margin-bottom:6px}
.game-card h3{font-family:var(--display);font-size:17px;letter-spacing:-.01em}
.game-card p{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.game-card .foot{display:flex;align-items:center;gap:9px;margin-top:10px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.game-card .best{color:var(--gold);font-weight:700}
.qty{margin-left:auto}

/* ---- badges live behind a click now ---- */
dialog::backdrop{background:rgba(20,22,26,.55)}
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);
  max-width:540px;width:calc(100% - 32px);box-shadow:var(--lift)}
.dh{display:flex;align-items:center;gap:10px;padding:20px 22px 0}
.dh h2{font-family:var(--display);font-size:21px;letter-spacing:-.01em}
.dh button{margin-left:auto;background:none;border:1px solid var(--line);color:var(--ink-3);
  border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;padding:16px 22px 22px}
.badge{border:1px solid var(--line);border-radius:11px;padding:12px;display:flex;gap:11px;
  align-items:center;background:var(--paper)}
.badge.got{border-color:var(--gold);background:var(--gold-soft)}
.badge .bi{font-size:20px;filter:grayscale(1);opacity:.4}
.badge.got .bi{filter:none;opacity:1}
.badge .bn{font-size:13px;font-weight:700;line-height:1.2}
.badge .bd{font-size:11.5px;color:var(--ink-2);line-height:1.3;margin-top:1px}

/* ---- in play ---- */
.hud{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:6px 14px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.pill.lives{color:var(--warm);letter-spacing:.09em}
.pill.streak{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.pill.timer{font-family:var(--mono);font-weight:700}
@keyframes pulse{50%{opacity:.5}}
.pill.timer.low{background:var(--warm);border-color:var(--warm);color:#fff;animation:pulse .7s infinite}
.hud .btn{margin-left:auto;padding:8px 16px;font-size:13.5px}
.bar{height:5px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .35s}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:26px;box-shadow:var(--shadow)}
.qtext{font-family:var(--display);font-size:21px;letter-spacing:-.015em;margin-bottom:14px;line-height:1.25}
.hint{font-size:13.5px;color:var(--ink-3);margin:-8px 0 14px}
pre{background:var(--cabinet);color:var(--cabinet-ink);padding:18px;border-radius:12px;
  overflow-x:auto;font-size:14px;line-height:1.75;margin-bottom:18px;font-family:var(--mono)}
pre .ln{color:#6E757E;user-select:none}
.opts{display:grid;gap:9px}
.opt{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:13px 16px;
  cursor:pointer;text-align:left;font-family:var(--mono);font-size:14.5px;color:inherit;
  transition:border-color .12s,background .12s,transform .1s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt.correct{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.opt.wrong{background:var(--warm-soft);border-color:var(--warm)}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf button{padding:22px;border-radius:14px;border:2px solid var(--line);background:var(--paper);
  font-family:var(--display);font-size:19px;font-weight:700;cursor:pointer;color:inherit;
  transition:transform .1s,border-color .12s,background .12s}
.tf button:active{transform:scale(.98)}
.tf .yes:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tf .no:hover{border-color:var(--warm);background:var(--warm-soft);color:var(--warm)}
.statement{font-size:19px;font-weight:600;text-align:center;padding:26px 14px;
  background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;
  min-height:104px;display:grid;place-items:center;line-height:1.4}
.statement code{font-family:var(--mono);background:var(--cabinet);color:var(--cabinet-ink);
  padding:2px 7px;border-radius:5px;font-size:15px}
input.blank{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:11px;
  background:var(--paper);color:inherit;font-family:var(--mono);font-size:15px}
input.blank:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.feedback{margin-top:16px;padding:14px 17px;border-radius:12px;font-size:14.5px;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--accent-soft);border-left:4px solid var(--accent)}
.feedback.no{background:var(--warm-soft);border-left:4px solid var(--warm)}
.feedback b{display:block;margin-bottom:3px}
.row{display:flex;gap:10px;margin-top:17px;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:0;border-radius:11px;padding:12px 24px;
  font-size:15px;font-weight:600;cursor:pointer;transition:filter .12s,transform .1s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink-2)}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:12px 13px;
  cursor:pointer;font-size:13.5px;text-align:left;color:inherit;line-height:1.35;
  transition:border-color .12s,background .12s}
.tile.code{font-family:var(--mono);font-weight:600}
.tile:hover{border-color:var(--accent)}
.tile.picked{border-color:var(--accent);background:var(--accent-soft)}
.tile.done{opacity:.28;pointer-events:none;border-style:dashed}
.tile.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.pool{display:grid;gap:8px;margin-bottom:15px}
.slot{background:var(--cabinet);color:var(--cabinet-ink);border-radius:11px;padding:12px 15px;
  font-family:var(--mono);font-size:13.5px;min-height:46px;display:flex;align-items:center;
  gap:10px;cursor:pointer;border:2px solid transparent;white-space:pre;overflow-x:auto}
.slot.empty{background:var(--paper);border:2px dashed var(--line);color:var(--ink-3);
  font-family:var(--body);font-size:13px;justify-content:center;cursor:default}
.slot .num{color:#6E757E;font-size:12px;flex-shrink:0}
.slot:hover:not(.empty){border-color:var(--accent)}
.built{margin-bottom:15px}
.built .slot{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}

.end{text-align:center;padding:30px 20px}
.end .big{font-family:var(--display);font-size:60px;font-weight:700;color:var(--accent);line-height:1;
  font-variant-numeric:tabular-nums}
.end h2{font-family:var(--display);margin:8px 0 6px;font-size:22px;letter-spacing:-.01em}
.end p{color:var(--ink-2)}
.unlocked{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;
  padding:14px;margin-top:18px;text-align:left}
.unlocked b{color:var(--gold);display:block;margin-bottom:6px;font-size:11px;
  font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em}
footer{text-align:center;color:var(--ink-3);font-size:12.5px;margin-top:30px;
  padding-top:18px;border-top:1px solid var(--line)}
footer a{color:var(--accent);text-decoration:none;margin:0 7px}
@media (max-width:560px){
  .feature{padding:22px}
  .feature .meta{position:static;text-align:left;margin-top:16px}
  .match{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
<header>
  <div>
    <h1>PHP <span>Arcade</span></h1>
    <p class="tagline">Six games, 141 questions. Nothing to install, works offline.</p>
  </div>
  <button class="theme-btn" id="themeBtn">theme</button>
</header>

<div id="app"></div>

<footer>
  <a data-path="../index.html">course home</a>·
  <a data-path="../flashcards.html">flashcards</a>·
  <a data-path="../exam-simulator.html">exam</a>
  <br><br>Your XP and badges are saved in this browser only.
</footer>
</div>

<script>
/* ============================================================
   QUESTION BANKS
   Want to add your own? Copy the shape of any object below.
   ============================================================ */

const OUTPUT_Q = [
  { code:'$x = 5;\n$y = "5";\nvar_dump($x == $y);', opts:['bool(true)','bool(false)','int(5)','error'], a:0,
    why:'== compares the VALUE only, so 5 and "5" are equal. Use === to compare the type too.' },
  { code:'$name = "Fatima";\necho \'Hello $name\';', opts:['Hello Fatima','Hello $name','Hello','error'], a:1,
    why:'Single quotes are literal. Only DOUBLE quotes read variables.' },
  { code:'echo 10 % 3;', opts:['3.33','3','1','0'], a:2,
    why:'% gives the REMAINDER. 3 goes into 10 three times, leaving 1.' },
  { code:'$a = [1, 2, 3];\necho count($a);', opts:['2','3','4','1,2,3'], a:1,
    why:'count() is how many items. The last INDEX is 2, but the count is 3.' },
  { code:'$a = ["x","y","z"];\necho $a[1];', opts:['x','y','z','1'], a:1,
    why:'Arrays start at index 0, so [0]=x, [1]=y, [2]=z.' },
  { code:'for ($i = 0; $i < 3; $i++) {\n    echo $i;\n}', opts:['0123','012','123','0 1 2 3'], a:1,
    why:'Starts at 0, stops when i reaches 3. So 0, 1, 2 - three rounds.' },
  { code:'$x = 5;\necho $x++;\necho $x;', opts:['56','55','66','65'], a:0,
    why:'$x++ prints the value FIRST (5), then adds 1. So the second echo gives 6.' },
  { code:'echo "5" + 5;', opts:['55','10','error','5 5'], a:1,
    why:'+ is for numbers, so PHP converts "5" to 5. To join text you need the dot.' },
  { code:'echo strlen("PHP rocks");', opts:['8','9','2','10'], a:1,
    why:'strlen counts every character, and the space counts too. 9.' },
  { code:'$grade = 10;\nif ($grade > 10) {\n    echo "pass";\n} else {\n    echo "fail";\n}',
    opts:['pass','fail','nothing','error'], a:1,
    why:'10 is not GREATER than 10. You wanted >= for "10 or more".' },
  { code:'$i = 1;\nwhile ($i <= 3) {\n    echo $i;\n}', opts:['123','111...forever','1','nothing'], a:1,
    why:'Nothing changes $i, so the condition stays true forever. Classic infinite loop.' },
  { code:'function f($n) {\n    return $n * 2;\n    echo "hi";\n}\necho f(4);', opts:['8hi','hi8','8','hi'], a:2,
    why:'return ends the function immediately. The echo after it never runs.' },
  { code:'$a = ["b" => 2];\necho $a["b"] + 3;', opts:['5','b3','23','error'], a:0,
    why:'$a["b"] is 2, and 2 + 3 is 5.' },
  { code:'echo ucfirst(strtolower("HELLO"));', opts:['HELLO','hello','Hello','hELLO'], a:2,
    why:'Inside out: strtolower makes "hello", then ucfirst capitalises the first letter.' },
  { code:'$x = 7;\necho ($x % 2 == 0) ? "even" : "odd";', opts:['even','odd','1','true'], a:1,
    why:'7 % 2 is 1, not 0, so the condition is false and the ternary gives the second value.' },
  { code:'$a = [3, 1, 2];\nsort($a);\necho implode("-", $a);', opts:['3-1-2','1-2-3','3-2-1','123'], a:1,
    why:'sort() puts them in order, implode glues them with your separator.' },
  { code:'echo 2 + 3 * 4;', opts:['20','14','24','9'], a:1,
    why:'Multiplication before addition, same as maths class. 3*4=12, +2 = 14.' },
  { code:'$s = "abc";\necho $s[0];', opts:['a','abc','0','error'], a:0,
    why:'A string can be read like an array of letters, starting at 0.' },
  { code:'$a = [10, 20, 30];\nforeach ($a as $v) {\n    $v = $v * 2;\n}\necho $a[0];', opts:['20','10','0','error'], a:1,
    why:'$v is a COPY. Changing it does not touch the array. You would need &$v or $a[$k].' },
  { code:'echo round(2.5) . "," . round(3.5);', opts:['2,3','3,4','2,4','3,3'], a:1,
    why:'PHP rounds .5 away from zero, so 2.5 becomes 3 and 3.5 becomes 4.' },
  { code:'$a = "10";\n$b = 10;\nvar_dump($a === $b);', opts:['bool(true)','bool(false)','int(10)','error'], a:1,
    why:'=== checks the type too. One is a string, the other an int.' },
  { code:'echo str_repeat("ab", 3);', opts:['ababab','ab3','aaabbb','abababab'], a:0,
    why:'str_repeat glues the whole string together that many times.' },
  { code:'$n = [5, 10, 15];\necho array_sum($n) / count($n);', opts:['30','10','15','3'], a:1,
    why:'Sum is 30, count is 3, so the average is 10.' },
  { code:'echo substr("Programming", 3, 4);', opts:['gram','ogra','Prog','ram'], a:0,
    why:'Start at index 3 (the g, because P=0 r=1 o=2 g=3) and take 4 characters.' },
  { code:'$x = "0";\nif ($x) {\n    echo "yes";\n} else {\n    echo "no";\n}', opts:['yes','no','0','error'], a:1,
    why:'The string "0" is one of PHP\'s falsy values. "0.0" or "false" would be true.' },
  { code:'for ($i = 1; $i <= 3; $i++) {\n    for ($j = 1; $j <= 2; $j++) {\n        echo $i;\n    }\n}',
    opts:['123','112233','111222','123123'], a:1,
    why:'The inner loop runs twice for every round of the outer one, so each number prints twice.' },
  { code:'echo max(3, 7) + min(3, 7);', opts:['10','4','14','21'], a:0,
    why:'max is 7, min is 3, and 7 + 3 = 10.' },
  { code:'$a = ["one","two"];\n$a[] = "three";\necho count($a);', opts:['2','3','4','error'], a:1,
    why:'$a[] = adds to the end without you giving an index. Now there are 3.' },

let state = {};
let save_ = {};

function store(k, v){
  try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }
  catch(e){ return null; }
}
function loadSave(){
  let s = { xp:0, best:{}, ach:[], played:[] };
  try{
    const raw = store('phparcade_save');
    if (raw) s = Object.assign(s, JSON.parse(raw));
  }catch(e){}
  save_ = s;
}
function commit(){ try{ store('phparcade_save', JSON.stringify(save_)); }catch(e){} }

function grant(id){
  if (save_.ach.includes(id)) return null;
  save_.ach.push(id); commit();
  return ACHIEVEMENTS.find(a => a.id === id);
}
function levelOf(xp){ return Math.min(LEVELS.length - 1, Math.floor(xp / 150)); }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(a){ const c=a.slice(); for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];} return c; }

/* ---------- menu ----------
   One featured game, then the rest. Six identical cards was the old design
   and it told her nothing about where to go next. The feature is picked
   from what she has actually played, so the page answers "what now?". */
function pickFeature(){
  const keys = Object.keys(GAMES);
  const unplayed = keys.filter(k => !save_.played.includes(k));
  if (unplayed.length) return { key:unplayed[0], why:'NEW &middot; you have not tried this one' };
  // everything played: offer the weakest score back
  const worst = keys.slice().sort((a,b) => (save_.best[a]||0) - (save_.best[b]||0))[0];
  return { key:worst, why:'YOUR WEAKEST ROUND &middot; beat it' };
}

function menu(){
  const lv = levelOf(save_.xp);
  const inLv = save_.xp % 150;
  const pct = lv < LEVELS.length - 1 ? inLv / 150 : 1;
  const C = 2 * Math.PI * 27;                       // ring radius 27
  const feat = pickFeature();
  const fg = GAMES[feat.key];
  const rest = Object.keys(GAMES).filter(k => k !== feat.key);

  app.innerHTML = `
  <div class="player">
    <div class="ring">
      <svg viewBox="0 0 62 62" aria-hidden="true">
        <circle class="t" cx="31" cy="31" r="27"></circle>
        <circle class="f" cx="31" cy="31" r="27"
                stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct)).toFixed(1)}"></circle>
      </svg>
      <b>${lv + 1}</b>
    </div>
    <div class="who">
      <div class="rank">${LEVELS[lv]}</div>
      <div class="xp">${save_.xp} XP${lv < LEVELS.length-1
        ? ` &middot; ${150 - inLv} to ${LEVELS[lv+1]}` : ' &middot; max rank'}</div>
    </div>
    <button class="badgebtn" id="badgeBtn">
      <span class="em">${save_.ach.length ? '🏅' : '🔒'}</span>
      ${save_.ach.length} of ${ACHIEVEMENTS.length} badges
    </button>
  </div>

  <button class="feature" data-game="${feat.key}">
    <span class="lab">${feat.why}</span>
    <h2>${fg.name}</h2>
    <p>${fg.desc}</p>
    <span class="go">${fg.icon} Play now</span>
    <span class="meta"><b>${fg.bank()}</b>questions<br>in this game</span>
  </button>

  <p class="sec">The other five</p>
  <div class="grid">` + rest.map(k => {
    const g = GAMES[k], b = save_.best[k] || 0;
    return `<button class="game-card" data-game="${k}">
      <div class="icon">${g.icon}</div>
      <h3>${g.name}</h3>
      <p>${g.desc}</p>
      <div class="foot">
        ${b ? `<span class="best">★ ${b}</span>` : '<span>not played</span>'}
        <span class="qty">${g.bank()} questions</span>
      </div>
    </button>`;
  }).join('') + `</div>

  <dialog id="badgeDlg">
    <div class="dh">
      <h2>Badges</h2>
      <button id="closeDlg">close</button>
    </div>
    <div class="badges">${ACHIEVEMENTS.map(a => {
      const got = save_.ach.includes(a.id);
      return `<div class="badge${got ? ' got' : ''}">
        <div class="bi">${a.icon}</div>
        <div><div class="bn">${a.name}</div><div class="bd">${a.desc}</div></div>
      </div>`;
    }).join('')}</div>
  </dialog>`;

  app.querySelectorAll('[data-game]').forEach(b => b.onclick = () => start(b.dataset.game));
  const dlg = document.getElementById('badgeDlg');
  document.getElementById('badgeBtn').onclick = () => dlg.showModal();
  document.getElementById('closeDlg').onclick = () => dlg.close();
}

function start(game){
  state = { game, score:0, lives:3, streak:0, i:0, answered:false, mistakes:0, xp:0, correct:0 };
  if (!save_.played.includes(game)){ save_.played.push(game); commit(); }
  if (game === 'output') state.qs = shuffle(OUTPUT_Q).slice(0, GAMES.output.len);
  if (game === 'bug')    state.qs = shuffle(BUG_Q).slice(0, GAMES.bug.len);
  if (game === 'blank')  state.qs = shuffle(BLANK_Q).slice(0, GAMES.blank.len);
  if (game === 'match')  state.qs = shuffle(MATCH_SETS).slice(0, GAMES.match.len);
  if (game === 'order')  state.qs = shuffle(ORDER_Q).slice(0, GAMES.order.len);
  if (game === 'speed'){ state.qs = shuffle(SPEED_Q); state.timeLeft = 45; }
  render();
}

function hud(){
  const total = state.qs.length;
  if (state.game === 'speed'){
    return `<div class="hud">
      <span class="pill timer${state.timeLeft <= 10 ? ' low' : ''}" id="timer">${state.timeLeft}s</span>
      <span class="pill">score ${state.score}</span>
      ${state.streak > 1 ? `<span class="pill streak">🔥 ${state.streak}</span>` : ''}
      <span style="flex:1"></span>
      <button class="btn ghost" id="quit">menu</button>
    </div><div class="bar"><i style="width:${state.timeLeft/45*100}%"></i></div>`;
  }
  return `<div class="hud">
      <span class="pill">${GAMES[state.game].icon} ${state.i + 1} / ${total}</span>
      <span class="pill">score ${state.score}</span>
      <span class="pill lives">${'♥'.repeat(Math.max(0,state.lives))}${'♡'.repeat(3-Math.max(0,state.lives))}</span>
      ${state.streak > 1 ? `<span class="pill streak">🔥 ${state.streak} in a row</span>` : ''}
      <span style="flex:1"></span>
      <button class="btn ghost" id="quit">menu</button>
    </div>
    <div class="bar"><i style="width:${(state.i / total) * 100}%"></i></div>`;
}

function wireCommon(){
  const q = document.getElementById('quit');
  if (q) q.onclick = () => { if (state.timer) clearInterval(state.timer); menu(); };
}

function refreshHud(){
  const pills = document.querySelectorAll('.hud .pill');
  if (state.game === 'speed'){ if (pills[1]) pills[1].textContent = 'score ' + state.score; return; }
  if (pills[1]) pills[1].textContent = 'score ' + state.score;
  const lv = Math.max(0, state.lives);
  if (pills[2]) pills[2].textContent = '♥'.repeat(lv) + '♡'.repeat(3 - lv);
}

function render(){
  if (state.game === 'speed') return renderSpeed();
  if (state.lives <= 0 || state.i >= state.qs.length) return end();
  if (state.game === 'match') return renderMatch();
  if (state.game === 'order') return renderOrder();
  if (state.game === 'blank') return renderBlank();
  if (state.game === 'bug')   return renderBug();
  renderOutput();
}

/* ---------- guess the output ---------- */
function renderOutput(){
  const q = state.qs[state.i];
  const order = shuffle(q.opts.map((o, i) => ({ o, i })));
  app.innerHTML = hud() + `<div class="panel">
    <p class="qtext">What does this print?</p>
    <pre>${esc(q.code)}</pre>
    <div class="opts">${order.map(x => `<button class="opt" data-i="${x.i}">${esc(x.o)}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div>
    <div class="row" id="nextRow" style="display:none"><button class="btn" id="next">next &rarr;</button></div>
  </div>`;
  wireCommon();
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const ok = +b.dataset.i === q.a;
    app.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.i === q.a) x.classList.add('correct'); });
    if (!ok) b.classList.add('wrong');
    judge(ok, q.why);
  });
}

/* ---------- fix the bug ---------- */
function renderBug(){
  const q = state.qs[state.i];
  app.innerHTML = hud() + `<div class="panel">
    <p class="qtext">Which line has the bug?</p>
    <p class="hint">Click the broken line.</p>
    <div class="opts">${q.code.map((line, i) =>
      `<button class="opt" data-i="${i}"><span class="ln">${i + 1}</span>&nbsp;&nbsp;${esc(line)}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div>
    <div class="row" id="nextRow" style="display:none"><button class="btn" id="next">next &rarr;</button></div>
  </div>`;
  wireCommon();
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const ok = +b.dataset.i === q.a;
    app.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.i === q.a) x.classList.add('correct'); });
    if (!ok) b.classList.add('wrong');
    judge(ok, q.why);
  });
}

/* ---------- fill the blank ---------- */
function renderBlank(){
  const q = state.qs[state.i];
  app.innerHTML = hud() + `<div class="panel">
    <p class="qtext">Type what belongs in the blank</p>
    <pre>${esc(q.code)}</pre>
    <input class="blank" id="inp" placeholder="your answer..." autocomplete="off" spellcheck="false">
    <div class="row"><button class="btn" id="check">check</button></div>
    <div class="feedback" id="fb"></div>
    <div class="row" id="nextRow" style="display:none"><button class="btn" id="next">next &rarr;</button></div>
  </div>`;
  wireCommon();
  const inp = document.getElementById('inp');
  inp.focus();
  const go = () => {
    if (state.answered) return;
    const val = inp.value.trim().replace(/[();$\s]/g, '').toLowerCase();
    const ok = q.a.some(a => a.toLowerCase().replace(/[();$\s]/g, '') === val);
    inp.disabled = true;
    document.getElementById('check').disabled = true;
    judge(ok, q.why + (ok ? '' : `  The answer was: ${q.a[0]}`));
  };
  document.getElementById('check').onclick = go;
  inp.onkeydown = e => { if (e.key === 'Enter') go(); };
}

/* ---------- match ---------- */
function renderMatch(){
  const set = state.qs[state.i];
  const left  = shuffle(set.pairs.map((p, i) => ({ t:p[0], i })));
  const right = shuffle(set.pairs.map((p, i) => ({ t:p[1], i })));
  app.innerHTML = hud() + `<div class="panel">
    <p class="qtext">${set.title}</p>
    <p class="hint">Click a word on the left, then its meaning on the right.</p>
    <div class="match">
      <div class="col">${left.map(x => `<button class="tile code" data-side="L" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div>
      <div class="col">${right.map(x => `<button class="tile" data-side="R" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div>
    </div>
    <div class="feedback" id="fb"></div>
    <div class="row" id="nextRow" style="display:none"><button class="btn" id="next">next &rarr;</button></div>
  </div>`;
  wireCommon();

  let picked = null, remaining = set.pairs.length, wrongHere = 0;
  app.querySelectorAll('.tile').forEach(t => t.onclick = () => {
    if (!picked || picked === t || picked.dataset.side === t.dataset.side){
      if (picked === t){ t.classList.remove('picked'); picked = null; return; }
      app.querySelectorAll('.tile').forEach(x => x.classList.remove('picked'));
      picked = t; t.classList.add('picked'); return;
    }
    if (picked.dataset.i === t.dataset.i){
      picked.classList.add('done'); t.classList.add('done');
      picked.classList.remove('picked'); picked = null;
      state.score += 5; state.xp += 3; refreshHud();
      remaining--;
      if (remaining === 0){
        state.streak++; state.correct++;
        if (wrongHere === 0){ state.score += 10; state.xp += 5; }
        else state.mistakes++;
        show(true, wrongHere === 0 ? 'Perfect set! +10 bonus.'
          : `Set complete with ${wrongHere} wrong tr${wrongHere === 1 ? 'y' : 'ies'}.`);
        state.answered = true;
        checkStreakBadge();
        document.getElementById('nextRow').style.display = 'flex';
        document.getElementById('next').onclick = () => { state.i++; state.answered = false; render(); };
      } else {
        document.getElementById('fb').className = 'feedback';
      }
    } else {
      wrongHere++;
      t.classList.add('shake'); picked.classList.add('shake');
      const a = picked, b = t;
      setTimeout(() => { a.classList.remove('shake','picked'); b.classList.remove('shake'); }, 320);
      picked = null;
      if (wrongHere % 3 === 0) state.lives--;
      show(false, 'Not a pair. Every third wrong try costs a life.');
      refreshHud();
      if (state.lives <= 0) setTimeout(end, 700);
    }
  });
}

/* ---------- code builder (order the lines) ---------- */
function renderOrder(){
  const q = state.qs[state.i];
  const pool = shuffle(q.lines.map((l, i) => ({ l, i })));
  let built = [];

  app.innerHTML = hud() + `<div class="panel">
    <p class="qtext">${esc(q.goal)}</p>
    <p class="hint">Click the lines in the order they should run. Click a built line to take it back.</p>
    <div class="built" id="built"></div>
    <div class="pool" id="pool"></div>
    <div class="feedback" id="fb"></div>
    <div class="row" id="nextRow" style="display:none"><button class="btn" id="next">next &rarr;</button></div>
  </div>`;
  wireCommon();

  function draw(){
    const bEl = document.getElementById('built'), pEl = document.getElementById('pool');
    bEl.innerHTML = built.length
      ? built.map((x, n) => `<div class="slot" data-b="${n}"><span class="num">${n+1}</span>${esc(x.l)}</div>`).join('')
      : `<div class="slot empty">your code appears here</div>`;
    pEl.innerHTML = pool.filter(x => !built.includes(x))
      .map(x => `<div class="slot" data-p="${x.i}">${esc(x.l)}</div>`).join('');

    bEl.querySelectorAll('[data-b]').forEach(el => el.onclick = () => {
      if (state.answered) return;
      built.splice(+el.dataset.b, 1); draw();
    });
    pEl.querySelectorAll('[data-p]').forEach(el => el.onclick = () => {
      if (state.answered) return;
      built.push(pool.find(x => x.i === +el.dataset.p)); draw();
      if (built.length === q.lines.length) finish();
    });
  }
  function finish(){
    const ok = built.every((x, n) => x.i === n);
    state.answered = true;
    document.getElementById('built').innerHTML = q.lines
      .map((l, n) => `<div class="slot"><span class="num">${n+1}</span>${esc(l)}</div>`).join('');
    judge(ok, q.why + (ok ? '' : ' The correct order is shown above.'));
  }
  draw();
}

/* ---------- speed round ---------- */
function renderSpeed(){
  if (state.i >= state.qs.length) state.i = 0;
  const [text, ans] = state.qs[state.i];
  app.innerHTML = hud() + `<div class="panel">
    <div class="statement">${text}</div>
    <div class="tf">
      <button class="yes" data-v="1">TRUE</button>
      <button class="no"  data-v="0">FALSE</button>
    </div>
    <div class="feedback" id="fb"></div>
  </div>`;
  wireCommon();

  if (!state.timer){
    state.timer = setInterval(() => {
      state.timeLeft--;
      const t = document.getElementById('timer');
      const bar = document.querySelector('.bar i');
      if (t){ t.textContent = state.timeLeft + 's'; t.classList.toggle('low', state.timeLeft <= 10); }
      if (bar) bar.style.width = (state.timeLeft / 45 * 100) + '%';
      if (state.timeLeft <= 0){ clearInterval(state.timer); state.timer = null; end(); }
    }, 1000);
  }

  app.querySelectorAll('.tf button').forEach(b => b.onclick = () => {
    const ok = (b.dataset.v === '1') === ans;
    if (ok){ state.score += 2; state.xp += 2; state.correct++; state.streak++; }
    else { state.score = Math.max(0, state.score - 1); state.streak = 0; state.mistakes++; }
    const fb = document.getElementById('fb');
    fb.className = 'feedback show ' + (ok ? 'ok' : 'no');
    fb.innerHTML = ok ? '✅ Yes' : '❌ No — it is ' + (ans ? 'TRUE' : 'FALSE');
    state.i++;
    setTimeout(() => { if (state.timer) renderSpeed(); }, ok ? 260 : 900);
  });
}

/* ---------- shared ---------- */
function show(ok, msg){
  const fb = document.getElementById('fb');
  fb.className = 'feedback show ' + (ok ? 'ok' : 'no');
  fb.innerHTML = `<b>${ok ? '✅ Correct!' : '❌ Not quite'}</b>${esc(msg)}`;
}
function checkStreakBadge(){
  if (state.streak >= 5) state.pendingStreak = true;
}
function judge(ok, why){
  state.answered = true;
  if (ok){
    state.streak++; state.correct++;
    const bonus = state.streak > 2 ? 5 : 0;
    state.score += 10 + bonus; state.xp += 10 + bonus;
    checkStreakBadge();
  } else {
    state.streak = 0; state.lives--; state.mistakes++;
  }
  refreshHud();
  show(ok, why);
  const row = document.getElementById('nextRow');
  row.style.display = 'flex';
  const nb = document.getElementById('next');
  nb.onclick = () => { state.i++; state.answered = false; render(); };
  nb.focus();
}

/* ---------- end ---------- */
function end(){
  if (state.timer){ clearInterval(state.timer); state.timer = null; }
  const g = state.game;
  const wasBest = state.score > (save_.best[g] || 0);
  if (wasBest) save_.best[g] = state.score;
  save_.xp += state.xp;

  const got = [];
  if (state.correct > 0) { const a = grant('first'); if (a) got.push(a); }
  if (state.pendingStreak) { const a = grant('streak5'); if (a) got.push(a); }
  if (state.mistakes === 0 && state.correct > 0) { const a = grant('perfect'); if (a) got.push(a); }
  if (state.lives === 3 && g !== 'speed' && state.i >= state.qs.length) { const a = grant('nolife'); if (a) got.push(a); }
  if (g === 'speed' && state.correct >= 15) { const a = grant('speed'); if (a) got.push(a); }
  if (save_.played.length >= 6) { const a = grant('explorer'); if (a) got.push(a); }
  if (save_.xp >= 100) { const a = grant('century'); if (a) got.push(a); }
  if (save_.xp >= 1000) { const a = grant('veteran'); if (a) got.push(a); }
  commit();

  let msg;
  if (g === 'speed')                  msg = `${state.correct} right in 45 seconds.`;
  else if (state.lives <= 0)          msg = 'Out of lives! Re-read the lesson and come back.';
  else if (state.mistakes === 0)      msg = 'Not a single mistake. You actually know this.';
  else if (state.mistakes <= 2)       msg = 'Good work. A couple more rounds and you own it.';
  else                                msg = 'Keep going. Re-read the lesson, then replay.';

  app.innerHTML = `<div class="panel end">
    <div class="big">${state.score}</div>
    <h2>${wasBest ? '🏆 New best score!' : GAMES[g].name}</h2>
    <p>${msg}</p>
    <p style="margin-top:8px;font-size:14px">
      +${state.xp} XP earned &middot; ${save_.xp} XP total &middot; best ever: ${save_.best[g] || 0}</p>
    ${got.length ? `<div class="unlocked"><b>Badge unlocked</b>${got.map(a =>
      `<div style="font-size:15px">${a.icon} <b style="display:inline;color:inherit;font-size:15px;text-transform:none;letter-spacing:0">${a.name}</b> &mdash; ${a.desc}</div>`).join('')}</div>` : ''}
    <div class="row" style="justify-content:center">
      <button class="btn" id="again">play again</button>
      <button class="btn ghost" id="back">all games</button>
    </div>
  </div>`;
  document.getElementById('again').onclick = () => start(g);
  document.getElementById('back').onclick = menu;
}

/* ---------- theme ---------- */
document.getElementById('themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const next = cur ? (cur === 'dark' ? 'light' : 'dark') : (dark ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next);
  store('phparcade_theme', next);
};
const savedTheme = store('phparcade_theme');
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

/* footer links resolve relatively from the repo, and to the sibling
   Artifacts when the page is published on its own */
const LOCAL = location.protocol === "file:"
  || ["localhost","127.0.0.1",""].indexOf(location.hostname) !== -1;
const PUBLISHED = {
  "../index.html":          "https://claude.ai/artifact/GyRYKwKisjEBU5wkBanfAe",
  "../flashcards.html":     "https://claude.ai/artifact/WDYShUSe2eV7Yu19XxYJZn",
  "../exam-simulator.html": "https://claude.ai/artifact/H3Ca9oVaXidqa51D5hesYc"
};
document.querySelectorAll("footer a[data-path]").forEach(a => {
  a.href = LOCAL ? a.dataset.path : (PUBLISHED[a.dataset.path] || a.dataset.path);
  if (!LOCAL){ a.target = "_blank"; a.rel = "noopener"; }
});

loadSave();
menu();
</script>
