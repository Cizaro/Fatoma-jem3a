<title>Business Quantitative Formulas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a study desk. Cobalt ink, a yellow highlighter for answers, coral for traps.
   Progress bar on top, pill tabs, one reading column; sections slide in, fractions draw their line. */
:root{
  --bg:#f5f6fb; --paper:#ffffff; --ink:#141a33; --muted:#5d6584; --rule:#e1e4f0;
  --accent:#2448d8; --accent-ink:#ffffff; --accent-soft:#e8ecfd;
  --mark:#ffd84a; --mark-ink:#141a33; --coral:#e2553f; --coral-soft:#fdebe7;
  --good:#16884a; --good-soft:#e3f5ea; --bad:#cc3524; --bad-soft:#fbe7e4;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1124; --paper:#171b34; --ink:#e9ebf7; --muted:#9aa1c2; --rule:#2a3053;
  --accent:#7d95ff; --accent-ink:#0e1124; --accent-soft:#232a52;
  --mark:#f5cc3a; --mark-ink:#141a33; --coral:#ff8a73; --coral-soft:#3a2124;
  --good:#5bd18e; --good-soft:#163527; --bad:#ff8574; --bad-soft:#3d1f1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1124; --paper:#171b34; --ink:#e9ebf7; --muted:#9aa1c2; --rule:#2a3053;
  --accent:#7d95ff; --accent-ink:#0e1124; --accent-soft:#232a52;
  --mark:#f5cc3a; --mark-ink:#141a33; --coral:#ff8a73; --coral-soft:#3a2124;
  --good:#5bd18e; --good-soft:#163527; --bad:#ff8574; --bad-soft:#3d1f1e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.6 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);box-shadow:0 1px 0 var(--rule)}
.prog{height:4px;background:var(--accent-soft);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--mark));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px 4px;max-width:920px;margin:0 auto}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 15px var(--f-display)}
.brand h1{font:800 21px/1 var(--f-display);margin:0;letter-spacing:-.02em}
.brand .count{margin-left:auto;font:600 13px var(--f-mono);color:var(--muted)}
nav{max-width:920px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding-block:8px 12px;scrollbar-width:thin}
nav button{flex:none;font:600 14px/1 var(--f-body);color:var(--muted);background:var(--bg);border:1px solid var(--rule);border-radius:999px;padding:9px 14px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s,transform .2s}
nav button:hover{color:var(--ink);transform:translateY(-1px)}
nav button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav button .tick{color:var(--good);margin-left:5px}
nav button[aria-current="true"] .tick{color:var(--accent-ink)}
nav button.exam{border-color:var(--coral);color:var(--coral)}
nav button.exam[aria-current="true"]{background:var(--coral);color:var(--paper)}
[hidden]{display:none!important}
main{max-width:800px;margin:0 auto;padding-block:32px 90px;display:grid;grid-template-columns:minmax(0,1fr);gap:30px}
main>*,section{min-width:0}
main>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rise{from{opacity:.25;transform:translateY(14px)}to{opacity:1;transform:none}}
h2{font:800 clamp(30px,5vw,44px)/1.05 var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.025em}
h2 em{font-style:normal;background:linear-gradient(transparent 58%,var(--mark) 58%);padding:0 .08em}
h3{font:700 12.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin:0 0 12px}
p{margin:0;max-width:65ch}
.lede{font-size:19px;color:var(--ink)}
.meta{font:500 13px var(--f-mono);color:var(--muted)}
section{display:grid;gap:12px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px 16px;min-width:120px}
.stat b{display:block;font:800 28px/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
td{padding:13px 15px;border-top:1px solid var(--rule);vertical-align:middle}
tr:first-child td{border-top:0}
tr{transition:background .2s}
tr:hover{background:var(--accent-soft)}
td.n{width:28%;min-width:130px;font-weight:700}
td.f{font-family:var(--f-mono);font-size:14px;min-width:220px}
td.m{color:var(--muted);font-size:14px;min-width:140px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px}
.fr>span:first-child{padding:0 4px 3px;background:linear-gradient(currentColor,currentColor) bottom/100% 1.5px no-repeat;animation:line .7s .2s cubic-bezier(.2,.8,.2,1) both}
.fr>span:last-child{padding:3px 4px 0}
@keyframes line{from{background-size:0 1.5px}to{background-size:100% 1.5px}}
.work{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;display:grid;gap:10px}
.work .q{font-weight:600}
ol.steps{margin:0;padding-left:22px;display:grid;gap:5px;font-variant-numeric:tabular-nums}
ol.steps b,.ans{background:var(--mark);color:var(--mark-ink);padding:0 4px;border-radius:3px}
.trap{background:var(--coral-soft);border-radius:12px;padding:15px 18px}
.trap strong{color:var(--coral);font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.12em;display:block;margin-bottom:4px}
.pq{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:16px 20px;display:grid;gap:12px;transition:border-color .3s,background .3s}
.pq.ok{border-color:var(--good);background:linear-gradient(var(--good-soft),var(--paper) 70%)}
.pq.no{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pq .n{font:600 12px var(--f-mono);color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text]{font:500 16px var(--f-mono);width:160px;padding:9px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink);transition:border-color .2s}
input[type=text]:focus{border-color:var(--accent)}
.opts{display:grid;gap:8px}
.opt{all:unset;cursor:pointer;padding:10px 14px;border:1.5px solid var(--rule);border-radius:8px;background:var(--bg);transition:border-color .2s,background .2s,transform .15s}
.opt:hover{border-color:var(--accent);transform:translateX(3px)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.btn{font:700 14px var(--f-body);padding:9px 16px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px -8px var(--accent)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:none;color:var(--accent)}
.btn.coral{background:var(--coral);border-color:var(--coral);color:var(--paper)}
input:focus-visible,button:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.unit{color:var(--muted);font-size:14px}
.fb{font-weight:700;font-size:15px}
.fb.ok{color:var(--good);animation:pop .35s} .fb.no{color:var(--bad)}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:none}}
.sol{border-top:1px dashed var(--rule);padding-top:10px}
.plan{display:grid;gap:8px}
.plan button{all:unset;cursor:pointer;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px 16px;background:var(--paper);border:1px solid var(--rule);border-radius:12px;transition:transform .2s,border-color .2s,box-shadow .2s;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 35ms + 150ms)}
.plan button:hover{transform:translateX(4px);border-color:var(--accent);box-shadow:0 8px 20px -14px var(--accent)}
.plan button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.plan .i{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 13px var(--f-mono)}
.plan .done .i{background:var(--good);color:var(--paper)}
.plan .t{font-weight:700}
.plan .m{font:500 13px var(--f-mono);color:var(--muted)}
.plan .x .i{background:var(--coral);color:var(--paper)}
.bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px 16px}
.timer{font:600 20px var(--f-mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--coral);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.result{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{width:120px;height:120px;flex:none}
.ring circle{fill:none;stroke-width:10}
.ring .bgc{stroke:var(--accent-soft)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-box:fill-box;transform-origin:center;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring text{fill:var(--ink);font:800 26px var(--f-display);text-anchor:middle;dominant-baseline:central}
.result a{color:var(--accent);font-weight:600}
.next{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.topic{display:grid;gap:12px;padding-top:14px;border-top:2px solid var(--accent-soft)}
.topic h4{font:800 23px/1.15 var(--f-display);margin:0;letter-spacing:-.015em}
@media (max-width:560px){
  .work,.pq{padding:14px 16px}
  table,tbody,tr,td{display:block}
  tr{border-top:1px solid var(--rule);padding:10px 0}
  tr:first-child{border-top:0}
  td,td.n,td.f,td.m{border:0;width:auto;min-width:0;padding:3px 14px}
  td.m:empty{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<header class="gut">
  <div class="brand"><span class="logo" aria-hidden="true">Σ</span><h1>Business Quantitative</h1><span class="count" id="count"></span></div>
  <nav id="nav" aria-label="Topics"></nav>
  <div class="prog" aria-hidden="true"><i id="prog"></i></div>
</header>
<main id="main" class="gut"></main>

<script src="formulas.js"></script>
<script src="questions.js"></script>
<script src="app.js"></script>
